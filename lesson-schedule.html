<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간 레슨 일정 · MRI ACADEMY</title>
<link rel="canonical" href="https://mriacademy.gg/lesson-schedule.html">
<style>
:root{
  --bg:#0a0a0c;--bg-card:#1a1a20;--bg-elev:#20202a;
  --ink:#f4f4f5;--ink-dim:#a1a1aa;--ink-faint:#71717a;
  --gold:#f5c518;--gold-soft:rgba(245,197,24,.3);--gold-deep:#caa00f;
  --green:#10b981;--blue:#5ac8fa;--purple:#a78bfa;--line:#27272a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(900px 500px at 50% -10%,rgba(245,197,24,.06),transparent 70%),linear-gradient(rgba(245,197,24,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(245,197,24,.022) 1px,transparent 1px);background-size:auto,37px 37px,37px 37px}
.wrap{max-width:760px;margin:0 auto;padding:40px 18px 80px}
.top{text-align:center;margin-bottom:8px}
.kick{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:30px;font-weight:800;margin:6px 0 10px;letter-spacing:-.02em}
.weekpill{display:inline-flex;align-items:center;gap:7px;background:var(--bg-card);border:1px solid var(--gold-soft);color:var(--gold);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700}
.note{text-align:center;color:var(--ink-dim);font-size:13px;margin:14px 0 4px}
.note b{color:var(--gold)}
.legend{text-align:center;color:var(--ink-faint);font-size:11.5px;margin-bottom:28px}
.grp{margin-bottom:30px}
.grp h2{font-size:16px;font-weight:800;margin-bottom:14px;padding-left:10px;border-left:3px solid var(--gold)}
.row{display:flex;gap:12px;margin-bottom:10px}
.day{flex:0 0 30px;text-align:center;font-weight:800;color:var(--ink-dim);padding-top:14px}
.card{flex:1;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.card.recruit{border-color:var(--gold-soft);background:linear-gradient(0deg,rgba(245,197,24,.05),rgba(245,197,24,.05)),var(--bg-card)}
.line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.time{font-size:15px;font-weight:800}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid}
.b-blue{color:var(--blue);border-color:rgba(90,200,250,.4);background:rgba(90,200,250,.08)}
.b-green{color:var(--green);border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)}
.b-gold{color:var(--gold);border-color:var(--gold-soft);background:rgba(245,197,24,.08)}
.b-type{color:var(--purple);border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.08)}
.b-recruit{color:#0a0a0c;background:var(--gold);border-color:var(--gold);font-weight:800}
.members{color:var(--ink-dim);font-size:13.5px}
.state{background:var(--bg-card);border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--ink-dim)}
.back{display:inline-block;margin-top:24px;color:var(--gold);text-decoration:none;font-size:14px}
.upd{text-align:center;color:var(--ink-faint);font-size:11px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="kick">Weekly Schedule</div>
    <h1>주간 레슨 일정</h1>
    <span class="weekpill">📅 <span id="week">불러오는 중…</span></span>
  </div>
  <p class="note"><b>자리 모집중</b> 표시된 그룹레슨은 추가 참여가 가능합니다. 일정 조율은 디스코드/카카오로 문의해 주세요.</p>
  <p class="legend">🟦 관전형 &nbsp; 🟩 참여형 &nbsp; 🟨 1:1</p>

  <div id="list"></div>
  <div id="state" class="state">일정을 불러오는 중…</div>

  <div style="text-align:center"><a class="back" href="/">← MRI ACADEMY 홈</a></div>
  <div class="upd" id="upd"></div>
</div>

<script>
// ⬇⬇⬇ 배포한 Apps Script 웹앱 /exec URL 을 여기에 붙여넣으세요 ⬇⬇⬇
const SHEET_API = "https://script.google.com/macros/s/AKfycbw4PsdbJAxINmSr8MkauxSHuROfnGsAo1-8X6Mu6Jno8VZDHaxVkTHcWg6EQJ0lfVP2Yg/exec";
// ⬆⬆⬆ (또는 이 URL 알려주면 박아서 최종본 드림)
// ⬇ 무리 직강 피드 (무리 master의 Apps Script /exec) — 배포 후 URL 교체
const MURI_API = "https://script.google.com/macros/s/AKfycbwei0BqGQg3VsIdpmGBW9NO3baqIt8foprrGt4Yiq5gD16ZjQrFTOdeEVHaATVWaSGJ/exec";

const DAYS = ["월","화","수","목","금","토","일"];
const FMT = { "관전형":["관전형","b-blue"], "참여형":["참여형","b-green"], "1:1":["1:1","b-gold"], "그룹강의":["그룹강의","b-green"], "개인강의":["개인강의","b-gold"] };
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ── 개인정보 보호: 시트는 본명 유지, 화면만 닉/마스킹 표시 ──
// 닉네임 매핑표: 여기에 "본명":"닉네임" 추가하면 그 수강생은 닉으로 표시됨
const NICK = {
  "양형석":"콩가",
  "박성민":"빡이",
  "김웅채":"감티",
};
function maskName(n){ // 매핑 없는 본명은 자동 마스킹 (박성민→박*민)
  if(n.length<=1) return n;
  if(n.length===2) return n[0]+"*";
  return n[0]+"*".repeat(n.length-2)+n[n.length-1];
}
function displayMembers(s){
  return String(s==null?"":s).split(",").map(tok=>{
    tok = tok.trim(); if(!tok) return "";
    const m = tok.match(/^(.+?)\s*\((.+)\)\s*$/); // "이름(닉)" → 닉만
    if(m) return m[2].trim();
    if(NICK[tok]) return NICK[tok];
    if(/^[가-힣]{2,4}$/.test(tok)) return maskName(tok); // 한글 이름은 마스킹
    return tok; // 그 외(팀명·문구 등)는 그대로
  }).filter(Boolean).join(", ");
}

function trainerRank(name){
  if(/무리/.test(name)) return 0;
  if(/현태/.test(name)) return 1;
  if(/준구/.test(name)) return 2;
  return 3;
}
function startMin(t){ const m=String(t).match(/(\d{1,2}):(\d{2})/); return m?(+m[1]*60 + +m[2]):9999; }
function thisWeekRange(){
  const n=new Date(), dow=(n.getDay()+6)%7; // 월=0
  const mon=new Date(n); mon.setDate(n.getDate()-dow);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const f=(d)=>`${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  return `2026.${f(mon)} ~ ${f(sun)}`;
}

async function load(){
  if(SHEET_API.indexOf("__EXEC")===0){ $("state").textContent="일정 연동 준비 중입니다."; $("week").textContent=thisWeekRange(); return; }
  try{
    const tasks = [ fetch(SHEET_API,{cache:"no-store"}).then(r=>r.json()).catch(()=>({lessons:[]})) ];
    if(MURI_API.indexOf("__MURI")!==0) tasks.push( fetch(MURI_API,{cache:"no-store"}).then(r=>r.json()).catch(()=>({lessons:[]})) );
    const results = await Promise.all(tasks);
    const d = results[0] || {lessons:[]};
    $("week").textContent = (d.week && d.week.range) ? ("2026."+d.week.range.replace(/\s/g,"").replace("~"," ~ ")) : thisWeekRange();
    const items = results.flatMap(x=>(x&&x.lessons)||[]);
    if(!items.length){ $("state").textContent="이번 주 등록된 일정이 없습니다."; return; }

    // 트레이너별 그룹화
    const groups = {};
    items.forEach(it=>{ (groups[it.trainer]=groups[it.trainer]||[]).push(it); });
    const order = Object.keys(groups).sort((a,b)=> trainerRank(a)-trainerRank(b) || a.localeCompare(b));

    let html="";
    order.forEach(tr=>{
      const rows = groups[tr].slice().sort((a,b)=> DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || startMin(a.time)-startMin(b.time));
      html += `<div class="grp"><h2>${esc(tr)}</h2>`;
      rows.forEach(it=>{
        const fmt = FMT[it.format] || [it.format||"수업","b-blue"];
        html += `<div class="row"><div class="day">${esc(it.day)}</div>
          <div class="card${it.recruit?" recruit":""}">
            <div class="line1">
              <span class="time">${esc(it.time)}</span>
              <span class="badge ${fmt[1]}">${esc(fmt[0])}</span>
              ${it.type?`<span class="badge b-type">${esc(it.type)}</span>`:""}
              ${it.recruit?`<span class="badge b-recruit">자리 모집중</span>`:""}
            </div>
            <div class="members">${esc(displayMembers(it.members))}</div>
          </div></div>`;
      });
      html += `</div>`;
    });
    $("list").innerHTML = html;
    $("state").style.display="none";
    if(d.updated){ const m=Math.max(0,Math.round((Date.now()-new Date(d.updated))/60000)); $("upd").textContent = "시트 연동 · 실시간 반영"; }
  }catch(e){
    $("state").textContent="일정을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.";
    $("week").textContent=thisWeekRange();
  }
}
load();
</script>
</body>
</html>
