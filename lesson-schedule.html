<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레슨 일정 · MRI ACADEMY</title>
<meta name="description" content="MRI ACADEMY 주간 레슨·직강 일정. 자리 모집중인 그룹을 확인하고 바로 합류하세요.">
<link rel="canonical" href="https://mriacademy.gg/lesson-schedule.html">
<meta property="og:title" content="레슨 일정 · MRI ACADEMY">
<meta property="og:description" content="주간 레슨·직강 일정 — 모집중 자리 확인.">
<meta property="og:url" content="https://mriacademy.gg/lesson-schedule.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* ── MRI 디자인 시스템 v1 · A "OLED Premium" ── */
:root{
  --bg:#0a0a0c; --surface-1:#15151a; --surface-2:#1a1a20;
  --ink:#f4f4f5; --ink-dim:#a1a1aa; --ink-faint:#71717a;
  --gold:#f5c518; --gold-deep:#caa00f; --gold-soft:rgba(245,197,24,.3);
  --line:#27272a;
  --display:'Space Grotesk',ui-sans-serif,sans-serif;      /* 영문·숫자 */
  --body:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif; /* 한글 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:44px 18px 120px}

/* 헤더 */
.top{margin-bottom:26px}
.kick{font-family:var(--display);color:var(--gold);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(26px,6vw,34px);font-weight:800;letter-spacing:-.02em;margin:8px 0 8px}
.lead{color:var(--ink-dim);font-size:14px;max-width:46ch}

/* 탭 (2층) */
.tabs{display:flex;flex-direction:column;gap:9px;margin:22px 0 6px}
.tabrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tabrow .lbl{font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;width:44px;flex:0 0 auto}
.tab{font-family:var(--body);font-weight:700;font-size:13px;padding:8px 15px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-dim);cursor:pointer;transition:.15s}
.tab:hover{border-color:var(--gold-soft);color:var(--ink)}
.tab[aria-selected="true"]{background:rgba(245,197,24,.1);border-color:var(--gold-soft);color:var(--gold)}
.range{font-family:var(--display);color:var(--ink-faint);font-size:12.5px;font-weight:500;margin:12px 0 22px}

/* 요일 그룹 */
.day{margin-bottom:26px}
.day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.day-h .dow{font-family:var(--display);font-size:15px;font-weight:700;color:var(--ink)}
.day-h .date{font-family:var(--display);font-size:12px;font-weight:500;color:var(--ink-faint)}
.day-h .today{font-family:var(--display);font-size:10px;font-weight:700;color:var(--gold);border:1px solid var(--gold-soft);border-radius:99px;padding:1px 8px;margin-left:auto}

/* 카드 */
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:border-color .15s,transform .15s}
.card:hover{border-color:#3a3a40}
.card.recruit{border-color:var(--gold-soft)}
.c1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.time{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.01em}
.chip{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;border:1px solid var(--line);background:var(--surface-1);color:var(--ink-dim)}
.c2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--ink-dim);font-size:13px}
.c2 .trainer{color:var(--ink);font-weight:700}
.c2 .seats{font-family:var(--display);font-weight:600;color:var(--ink-dim)}
.title{color:var(--ink-faint);font-size:12.5px;margin-top:6px}

/* 모집중 뱃지 — 이 페이지의 유일한 골드 글로우 */
.recruiting{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#0a0a0c;background:var(--gold);border-radius:99px;padding:3px 10px}
@media (prefers-reduced-motion: no-preference){
  .recruiting{animation:glowpulse 2.6s ease-in-out infinite}
}
@keyframes glowpulse{
  0%,100%{box-shadow:0 0 0 0 rgba(245,197,24,.0)}
  50%{box-shadow:0 0 14px 1px rgba(245,197,24,.45)}
}

/* 빈 주 상태 */
.empty{background:var(--surface-1);border:1px dashed var(--line);border-radius:14px;padding:44px 22px;text-align:center}
.empty .em{font-size:30px;margin-bottom:12px;opacity:.6}
.empty p{color:var(--ink-dim);font-size:14px;line-height:1.7;margin-bottom:18px}
.empty .cta{display:inline-block;font-weight:800;font-size:14px;color:#0a0a0c;background:linear-gradient(135deg,var(--gold),var(--gold-deep));border-radius:9px;padding:12px 22px;text-decoration:none}

.note{color:var(--ink-faint);font-size:12px;line-height:1.7;margin-top:26px;text-align:center}
.back{display:inline-block;margin-top:14px;color:var(--gold);text-decoration:none;font-weight:700;font-size:13.5px}

/* 하단 고정 신청 바 */
.applybar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,10,12,.86);backdrop-filter:saturate(140%) blur(8px);border-top:1px solid var(--line)}
.applybar .in{max-width:720px;margin:0 auto;padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
.applybar .txt{flex:1;min-width:0;font-size:13px;color:var(--ink-dim)}
.applybar .txt b{color:var(--ink)}
.applybar a{flex:0 0 auto;font-weight:800;font-size:14px;color:#0a0a0c;background:linear-gradient(135deg,var(--gold),var(--gold-deep));border-radius:9px;padding:12px 20px;text-decoration:none;white-space:nowrap}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="12a35ed9-1619-4484-8ad7-7fb7b1dfe52d"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="kick">Weekly Schedule</div>
    <h1>레슨 일정</h1>
    <p class="lead">주간 레슨·직강 일정입니다. <b style="color:var(--gold)">모집중</b> 표시된 그룹은 빈 자리에 바로 합류할 수 있어요.</p>
    <div class="tabs">
      <div class="tabrow"><span class="lbl">구분</span>
        <button class="tab" data-kind="lesson" aria-selected="true">레슨</button>
        <button class="tab" data-kind="direct" aria-selected="false">직강</button>
      </div>
      <div class="tabrow"><span class="lbl">주간</span>
        <button class="tab" data-week="0" aria-selected="true">이번 주</button>
        <button class="tab" data-week="1" aria-selected="false">다음 주</button>
        <button class="tab" data-week="2" aria-selected="false">다다음 주</button>
      </div>
    </div>
    <div class="range" id="range">불러오는 중…</div>
  </div>

  <div id="list" aria-live="polite"></div>

  <p class="note">일정 조율·문의는 디스코드/카카오로. 정원·시간은 상담 시 안내드립니다.<br>
    <a class="back" href="/">← MRI ACADEMY 홈</a></p>
</div>

<div class="applybar">
  <div class="in">
    <div class="txt"><b>레벨테스트 없이</b> 레슨 신청 가능</div>
    <a href="apply.html">상담 신청하기 →</a>
  </div>
</div>

<script type="module">
const API = "https://mri-academy-production.up.railway.app";
const DOW = ["일","월","화","수","목","금","토"];
const state = { kind: "lesson", week: 0 };
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dowLabel = (d) => DOW[new Date(d+"T00:00:00Z").getUTCDay()];
const mdLabel = (d) => { const p=d.split("-"); return `${+p[1]}.${+p[2]}`; };
const hhmm = (t) => t ? String(t).slice(0,5) : "";
const kstToday = () => new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);

// 모션 (실패해도 콘텐츠는 보임 — 카드는 기본 opacity 1)
let animate=null, stagger=null;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!reduce){
  try{ const m = await import("https://cdn.jsdelivr.net/npm/motion@11/+esm"); animate=m.animate; stagger=m.stagger; }catch(e){ /* CDN 실패 → 정적 표시 */ }
}
function reveal(){
  if(!animate) return;
  const cards = document.querySelectorAll("[data-reveal]");
  if(!cards.length) return;
  cards.forEach(c=>{ c.style.opacity="0"; });
  animate(cards, { opacity:[0,1], transform:["translateY(12px)","translateY(0)"] },
    { duration:.4, delay: stagger(0.045), easing:"ease-out" });
}

function fmtBadge(f){ return `<span class="chip">${esc(f)}</span>`; }
function seatText(e){
  if(e.capacity!=null){ return `${e.filled}/${e.capacity}명`; }
  return e.filled ? `${e.filled}명` : "";
}

function render(data){
  const range = $("#range"), list = $("#list");
  const wk = data.week;
  range.textContent = wk ? `${wk.start.replace(/-/g,".")} ~ ${data.__endLabel}` : "";
  const events = (data.events||[]).slice()
    .sort((a,b)=> (a.event_date<b.event_date?-1:a.event_date>b.event_date?1:0) || (hhmm(a.start_time)<hhmm(b.start_time)?-1:1));

  if(!events.length){
    list.innerHTML = `<div class="empty">
      <div class="em">🗓️</div>
      <p>이번 주 ${state.kind==="lesson"?"레슨":"직강"} 일정이 아직 없어요.<br>다른 주를 확인하거나, 상담을 신청하면 맞는 자리로 안내해 드려요.</p>
      <a class="cta" href="apply.html">상담 신청하기 →</a>
    </div>`;
    return;
  }

  const byDay = {};
  events.forEach(e=>{ (byDay[e.event_date]=byDay[e.event_date]||[]).push(e); });
  const today = kstToday();
  let html="";
  Object.keys(byDay).sort().forEach(date=>{
    html += `<section class="day">
      <div class="day-h"><span class="dow">${dowLabel(date)}요일</span><span class="date">${mdLabel(date)}</span>${date===today?`<span class="today">오늘</span>`:""}</div>`;
    byDay[date].forEach(e=>{
      const time = hhmm(e.start_time) + (e.end_time?`–${hhmm(e.end_time)}`:"");
      const seats = seatText(e);
      html += `<div class="card${e.is_recruiting?" recruit":""}" data-reveal>
        <div class="c1">
          ${time?`<span class="time">${esc(time)}</span>`:""}
          ${fmtBadge(e.format)}
          ${e.is_recruiting?`<span class="recruiting">● 모집중</span>`:""}
        </div>
        <div class="c2">
          ${e.trainer?`<span class="trainer">${esc(e.trainer)}</span>`:""}
          ${seats?`<span class="seats">${esc(seats)}</span>`:""}
        </div>
        ${e.title?`<div class="title">${esc(e.title)}</div>`:""}
      </div>`;
    });
    html += `</section>`;
  });
  list.innerHTML = html;
  reveal();
}

async function load(){
  $("#range").textContent = "불러오는 중…";
  $("#list").innerHTML = "";
  try{
    const r = await fetch(`${API}/api/schedule?week=${state.week}&kind=${state.kind}`, { cache:"no-store" });
    const d = await r.json();
    // 주 종료 라벨(포함형) = end - 1일
    if(d.week){ const e=new Date(d.week.end+"T00:00:00Z"); e.setUTCDate(e.getUTCDate()-1); d.__endLabel = e.toISOString().slice(0,10).replace(/-/g,"."); }
    render(d);
  }catch(e){
    $("#list").innerHTML = `<div class="empty"><div class="em">⚠️</div><p>일정을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</p><a class="cta" href="apply.html">상담 신청하기 →</a></div>`;
    $("#range").textContent = "";
  }
}

// 탭 배선
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const grp = btn.dataset.kind!=null ? "kind" : "week";
    const val = btn.dataset.kind!=null ? btn.dataset.kind : Number(btn.dataset.week);
    if(state[grp]===val) return;
    state[grp] = val;
    const attr = grp==="kind" ? "data-kind" : "data-week";
    document.querySelectorAll(`.tab[${attr}]`).forEach(b=> b.setAttribute("aria-selected","false"));
    btn.setAttribute("aria-selected","true");
    load();
  });
});
load();
</script>
</body>
</html>
