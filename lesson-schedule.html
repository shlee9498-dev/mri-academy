<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수업 시간표 · MRI ACADEMY</title>
<meta name="description" content="MRI ACADEMY 트레이너가 앱에 열어 둔 빈 시간을 주마다 보여 줘요. 개인 레슨 · 그룹 · 관전형 · 원장 직강 자리를 확인하고 신청할 수 있어요.">
<link rel="canonical" href="https://mriacademy.gg/lesson-schedule.html">
<meta property="og:title" content="수업 시간표 · MRI ACADEMY">
<meta property="og:description" content="트레이너가 열어 둔 이번 주 빈 시간과 남은 자리">
<meta property="og:url" content="https://mriacademy.gg/lesson-schedule.html">
<meta name="theme-color" content="#FBF6EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== 디자인 시스템 B3(2026-10-21 · CLAUDE.md §디자인 시스템 B3) — 크림 바탕 · 흰 카드 · 검정 알약 버튼 ===== */
:root{
  --bg:#FBF6EF; --card:#fff; --line:#EEE5D9;
  --ink:#1A1714; --sub:#5A5047; --mute:#8A7E72; --kick:#B4662A; --hl:#FFE58A;
  --sans:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --num:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.04);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;
  background-color:var(--bg);background-image:radial-gradient(rgba(120,90,60,.10) 1.2px,transparent 1.2px);background-size:26px 26px}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:44px 140px}
.num{font-family:var(--num);font-weight:800;font-variant-numeric:tabular-nums}

/* 머리 */
.kick{font-size:14px;font-weight:700;color:var(--kick)}
h1{margin-top:8px;font-size:clamp(32px,6vw,44px);font-weight:900;line-height:1.15;letter-spacing:-.045em}
.lead{margin-top:12px;color:var(--sub);max-width:34em}

/* 주 · 종류 고르기 */
.pick{display:grid;gap:10px;margin-top:28px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;font:700 14px/1 var(--sans);padding:11px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.range{margin-top:16px;font-size:14px;color:var(--mute)}

/* 날짜 묶음 · 칸 카드 */
#list{margin-top:8px}
.day{margin-top:26px}
.day-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.day-h b{font-size:18px;font-weight:900;letter-spacing:-.02em}
.day-h span{font-size:14px;color:var(--mute)}
.day-h .today{font-size:12px;font-weight:700;color:var(--ink);background:var(--hl);border-radius:6px;padding:2px 7px}
.slots{display:grid;gap:10px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-width:0}
.slot-btn{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 16px;width:100%;padding:16px 20px;cursor:pointer;border-radius:20px}
.slot-btn:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.slot.full .slot-btn{cursor:default}
.t{font-size:22px;line-height:1.1}
.t small{display:block;margin-top:4px;font:500 13px/1 var(--sans);color:var(--mute)}
.who{min-width:0}
.who .k{font-size:13px;font-weight:700;color:var(--kick)}
.who .n{font-size:16px;font-weight:700}
.seat{font-size:14px;font-weight:700;white-space:nowrap;padding:6px 12px;border-radius:999px;background:#F6EFE5}
.slot.full .seat{background:transparent;color:var(--mute);border:1px solid var(--line)}
.slot.full .t,.slot.full .who{opacity:.55}
/* 누르면 펼쳐지는 신청 길 — 새로 오는 분 / 이미 수강생 */
.go{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 18px}
.go[hidden]{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:hover{opacity:.9}

/* 빈 주 · 불러오기 실패 */
.empty{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:clamp(24px,5vw,36px)}
.empty h2{font-size:22px;font-weight:900;letter-spacing:-.03em}
.empty p{margin-top:8px;color:var(--sub)}
.empty .btn{margin-top:20px}

.note{margin-top:36px;font-size:14px;color:var(--mute)}
.note a{color:var(--sub)}

/* 아래 고정 신청 줄 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(251,246,239,.96);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .txt{font-size:14px;color:var(--sub);min-width:0}
.bar .txt b{color:var(--ink)}
@media(max-width:480px){
  .wrap{padding-inline:16px}
  .slot-btn{grid-template-columns:minmax(0,1fr) auto;padding:14px 16px}
  .who{grid-column:1 / -1;grid-row:2}
  .go{padding:0 16px 16px}
  .bar .txt{display:none}
  .bar .btn{width:100%}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="12a35ed9-1619-4484-8ad7-7fb7b1dfe52d"></script>
</head>
<body>
<main class="wrap">
  <div class="kick">수업 시간표</div>
  <h1>트레이너가 열어 둔 빈 시간</h1>
  <p class="lead">트레이너가 앱에 올린 빈 시간을 그대로 보여 줘요. 칸을 누르면 신청하는 길이 나와요</p>

  <div class="pick">
    <div class="row" role="group" aria-label="주 고르기">
      <button type="button" class="chip" data-week="0" aria-pressed="true">이번 주</button>
      <button type="button" class="chip" data-week="1" aria-pressed="false">다음 주</button>
      <button type="button" class="chip" data-week="2" aria-pressed="false">다다음 주</button>
    </div>
    <div class="row" role="group" aria-label="수업 종류 고르기">
      <button type="button" class="chip" data-kind="" aria-pressed="true">전체</button>
      <button type="button" class="chip" data-kind="personal" aria-pressed="false">개인 레슨</button>
      <button type="button" class="chip" data-kind="participate" aria-pressed="false">그룹(참여형)</button>
      <button type="button" class="chip" data-kind="spectate" aria-pressed="false">관전형</button>
      <button type="button" class="chip" data-kind="course" aria-pressed="false">직강</button>
    </div>
  </div>
  <p class="range" id="range">불러오는 중</p>

  <div id="list" aria-live="polite"></div>

  <p class="note">시간은 한국 시간이에요. 판수 차감과 가격은 <a href="index.html#plans">가격 안내</a>에 있어요<br>
    <a href="index.html">MRI ACADEMY 홈으로</a></p>
</main>

<div class="bar">
  <div class="in">
    <div class="txt">새로 오는 분은 <b>레벨 테스트</b>부터 시작해요</div>
    <a class="btn" href="apply.html?utm_source=site&amp;utm_medium=schedule_bar">레벨 테스트 신청</a>
  </div>
</div>

<script>
// 수업 시간표 — GET /api/schedule?week=0|1|2 (트레이너 앱 빈 시간 trainer_slots · 계약은 경비 몫)
// 기대하는 응답(경비 계약 절이 머지되면 그 절 이름으로 맞춘다):
//   { week:{start,end}, slots:[{ id, startAt(ISO), durationMin, lessonType:"personal"|"participate"|"spectate"|"course",
//     trainer, seatsLeft, full }], recent14:{ sessions } }
// 숫자(남은 자리 · 마감 · 최근 2주 수업 횟수)는 서버 값만 쓴다. 화면은 날짜 · 시각 표기만 한다. 글자는 textContent 로만 넣는다.
(function(){
  var API = "https://mri-academy-production.up.railway.app";
  var DISCORD = "https://discord.gg/9RjqdSKw";
  var APPLY = "apply.html?utm_source=site&utm_medium=schedule";
  var KIND = { personal: "개인 레슨", participate: "그룹(참여형)", spectate: "관전형", course: "원장 직강" };
  var WEEK = ["이번 주", "다음 주", "다다음 주"];
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  var state = { week: 0, kind: "" }, data = null;
  var list = document.getElementById("list"), range = document.getElementById("range");

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function link(cls, href, text, ext){ var a = el("a", cls, text); a.href = href; if (ext) { a.target = "_blank"; a.rel = "noopener"; } return a; }
  // 시각은 한국 시간으로만 읽는다(UTC 그대로 읽으면 날짜가 하루 밀린다)
  function kst(iso){ var t = Date.parse(iso); if (!isFinite(t)) return null; var d = new Date(t + 9 * 3600000);
    return { date: d.toISOString().slice(0, 10), hm: d.toISOString().slice(11, 16), dow: DOW[d.getUTCDay()] }; }
  function md(date){ var p = date.split("-"); return (+p[1]) + "월 " + (+p[2]) + "일"; }
  function len(min){ min = Number(min); if (!(min > 0)) return ""; var h = Math.floor(min / 60), m = min % 60;
    return (h ? h + "시간" : "") + (h && m ? " " : "") + (m ? m + "분" : ""); }
  var today = kst(new Date().toISOString()).date;

  function emptyBox(title, line){
    var box = el("div", "empty");
    box.appendChild(el("h2", null, title));
    if (line) box.appendChild(el("p", null, line));
    box.appendChild(link("btn", APPLY, "레벨 테스트 신청"));
    return box;
  }
  function card(s, t){
    var full = !!s.full || !(Number(s.seatsLeft) > 0);
    var li = el("div", "slot" + (full ? " full" : ""));
    var b = el("button", "slot-btn"); b.type = "button";
    var tm = el("div", "t num", t.hm); tm.appendChild(el("small", null, len(s.durationMin)));
    var who = el("div", "who"); who.appendChild(el("div", "k", KIND[s.lessonType] || "수업")); who.appendChild(el("div", "n", s.trainer || ""));
    var seat = el("div", "seat", full ? "마감" : "남은 자리 " + Number(s.seatsLeft));
    b.appendChild(tm); b.appendChild(who); b.appendChild(seat);
    li.appendChild(b);
    if (full) { b.disabled = true; b.setAttribute("aria-label", t.hm + " " + (KIND[s.lessonType] || "") + " 마감"); return li; }
    var go = el("div", "go"); go.hidden = true; go.id = "go-" + String(s.id || Math.random()).replace(/[^A-Za-z0-9_-]/g, "");
    go.appendChild(link("btn", APPLY, "처음이에요 · 레벨 테스트 신청"));
    go.appendChild(link("btn ghost", DISCORD, "수강생이에요 · 디스코드로 신청", true));
    b.setAttribute("aria-expanded", "false"); b.setAttribute("aria-controls", go.id);
    b.addEventListener("click", function(){ var open = go.hidden; go.hidden = !open; b.setAttribute("aria-expanded", String(open)); });
    li.appendChild(go);
    return li;
  }
  function render(){
    list.textContent = "";
    var wk = data && data.week;
    range.textContent = wk && wk.start ? md(wk.start) + "부터 7일" : "";
    var slots = ((data && data.slots) || []).filter(function(s){ return !state.kind || s.lessonType === state.kind; });
    if (!slots.length) {
      var name = WEEK[state.week] + (state.kind ? " " + KIND[state.kind] : "");
      var n = data && data.recent14 && Number(data.recent14.sessions);
      list.appendChild(emptyBox(name + "는 자리가 다 찼어요", n > 0 ? "최근 2주 수업 " + n + "회 진행" : ""));
      return;
    }
    var byDay = {}, order = [];
    slots.forEach(function(s){ var t = kst(s.startAt); if (!t) return; if (!byDay[t.date]) { byDay[t.date] = []; order.push(t.date); } byDay[t.date].push([s, t]); });
    order.sort().forEach(function(date){
      var sec = el("section", "day"), h = el("div", "day-h"), first = byDay[date][0][1];
      h.appendChild(el("b", null, first.dow + "요일")); h.appendChild(el("span", null, md(date)));
      if (date === today) h.appendChild(el("span", "today", "오늘"));
      sec.appendChild(h);
      var box = el("div", "slots");
      byDay[date].sort(function(a, b){ return a[1].hm < b[1].hm ? -1 : 1; }).forEach(function(p){ box.appendChild(card(p[0], p[1])); });
      sec.appendChild(box); list.appendChild(sec);
    });
  }
  function load(){
    range.textContent = "불러오는 중"; list.textContent = ""; data = null;
    fetch(API + "/api/schedule?week=" + state.week, { cache: "no-store" })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(d){ data = d || {}; render(); })
      .catch(function(){ range.textContent = ""; list.textContent = "";
        list.appendChild(emptyBox("시간표를 불러오지 못했어요", "잠시 뒤 새로고침해 주세요. 급하면 디스코드로 물어봐도 돼요")); });
  }
  document.querySelectorAll(".chip").forEach(function(c){
    c.addEventListener("click", function(){
      var isWeek = c.hasAttribute("data-week"), attr = isWeek ? "data-week" : "data-kind";
      document.querySelectorAll(".chip[" + attr + "]").forEach(function(x){ x.setAttribute("aria-pressed", "false"); });
      c.setAttribute("aria-pressed", "true");
      if (isWeek) { state.week = Number(c.getAttribute("data-week")) || 0; load(); }
      else { state.kind = c.getAttribute("data-kind") || ""; if (data) render(); }
    });
  });
  load();
})();
</script>
</body>
</html>
