<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>경기 복기 시험판 · MRI ACADEMY</title>
<link rel="canonical" href="https://mriacademy.gg/replay.html">
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c; --surface-1:#15151a; --surface-2:#1a1a20; --line:#26262e;
  --ink:#ececf1; --muted:#9a9aa6; --gold:#f5c518;
  --blue:#4f8cff; --white-zone:#f2f2f2; --red:#ff5a4f; --mate1:#7fc8a9; --mate2:#8fb3ff; --mate3:#d79ad8;
  --num:'Saira Condensed','Pretendard Variable',sans-serif;
  --body:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:15px;margin-top:4px}
.fine{color:var(--muted);font-size:12px;margin-top:8px}
section{margin-top:20px}
form{display:flex;flex-direction:column;gap:10px;margin-top:16px}
input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
input[type=text]::placeholder{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,a.chip{font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
button:focus-visible,input:focus-visible,a.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
button.primary{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700;justify-content:center;min-height:48px}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;font-size:15px;color:var(--ink);background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.msg[hidden]{display:none}
ul.matches{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:12px}
ul.matches button{width:100%;border-radius:12px;justify-content:space-between;gap:8px;padding:12px 14px;min-height:56px;text-align:left;white-space:normal}
.m-main{display:flex;flex-direction:column}
.m-sub{color:var(--muted);font-size:12px}
.m-rank{font-family:var(--num);font-size:24px;font-weight:700}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:6px;color:var(--muted)}
.tag.comp{color:var(--gold);border-color:var(--gold)}
.stage{position:relative;width:100%;aspect-ratio:1/1;background:var(--surface-1);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;left:8px;top:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-family:var(--num);font-size:12px}
.hud span{background:rgba(10,10,12,.78);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.toast{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(10,10,12,.86);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;pointer-events:none}
.toast[hidden]{display:none}
.toast .ours{color:var(--gold)} .toast .theirs{color:var(--red)}
.bar{display:flex;align-items:center;gap:8px;margin-top:10px}
#play{min-width:64px;font-weight:700;justify-content:center}
.time{font-family:var(--num);font-size:15px;min-width:92px;text-align:right;color:var(--muted)}
.track{position:relative;flex:1;height:36px}
.track input{position:absolute;inset:0;width:100%;height:36px;opacity:0;cursor:pointer;margin:0}
.rail{position:absolute;left:0;right:0;top:16px;height:4px;background:var(--line);border-radius:2px;pointer-events:none}
.fill{position:absolute;left:0;top:16px;height:4px;background:var(--ink);border-radius:2px;pointer-events:none}
.tick{position:absolute;top:10px;width:2px;height:16px;border-radius:1px;pointer-events:none}
.tick.phase{background:var(--muted);opacity:.5;top:12px;height:12px}
.tick.ours{background:var(--gold)} .tick.theirs{background:var(--red)} .tick.card{background:var(--ink);top:6px;height:24px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{font-size:12px;padding:6px 10px;min-height:32px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
h2{font-size:15px;font-weight:800;margin-top:24px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.card .k{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card .k b{color:var(--gold);font-weight:700}
.card p{font-size:15px;margin-top:6px}
.card p.ask{color:var(--muted)}
.card .row{margin-top:10px}
.card .row button{font-size:12px;min-height:32px;padding:6px 10px}
.thanks{font-size:12px;color:var(--muted)}
.survey{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:24px}
.survey p{font-size:15px}
.survey .row{margin-top:10px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>경기 복기 시험판</h1>
    <p class="lead">닉네임만 넣으면 최근 경기를 2D 지도로 다시 보고, 무리 기준 질문 3개를 받아요</p>
    <p class="fine">경기가 끝난 뒤 복기만 해요. 게임 중 실시간 도움은 하지 않아요</p>
  </header>

  <section id="step-find">
    <form id="find" autocomplete="off">
      <input id="name" type="text" name="pubg-name" inputmode="text" autocapitalize="off" spellcheck="false"
             placeholder="배그 닉네임" aria-label="배그 닉네임" maxlength="32" required>
      <div class="row" role="group" aria-label="플랫폼">
        <button type="button" data-plat="steam" aria-pressed="true">스팀</button>
        <button type="button" data-plat="kakao" aria-pressed="false">카카오</button>
      </div>
      <button class="primary" type="submit" id="go">최근 경기 보기</button>
    </form>
    <p class="msg" id="findMsg" role="status" hidden></p>
    <ul class="matches" id="matches" aria-label="최근 경기"></ul>
  </section>

  <section id="step-view" hidden>
    <div class="row" style="justify-content:space-between">
      <button type="button" id="back">다른 경기 고르기</button>
      <span class="fine" id="meta" style="margin:0"></span>
    </div>
    <div class="stage">
      <canvas id="map" aria-label="경기 2D 지도. 두 손가락으로 확대하고 한 손가락으로 옮겨요"></canvas>
      <div class="hud"><span id="phase">대기</span><span id="alive">생존 -</span></div>
      <div class="toast" id="toast" aria-live="polite" hidden></div>
    </div>
    <div class="bar">
      <button id="play" type="button" aria-label="재생">재생</button>
      <div class="track" id="track">
        <div class="rail"></div><div class="fill" id="fill"></div>
        <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="경기 시간">
      </div>
      <span class="time" id="time">00:00</span>
    </div>
    <div class="row" role="group" aria-label="배속" style="margin-top:8px">
      <button type="button" data-speed="4">4배</button>
      <button type="button" data-speed="10" aria-pressed="true">10배</button>
      <button type="button" data-speed="30">30배</button>
      <button type="button" id="follow" aria-pressed="false">따라가기</button>
      <button type="button" id="reset">전체 보기</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button type="button" id="prevFight">이전 교전</button>
      <button type="button" id="nextFight">다음 교전</button>
    </div>
    <div class="chips" id="phases" role="group" aria-label="페이즈로 이동"></div>
    <div class="legend" id="legend"></div>

    <h2>무리 기준으로 짚어 볼 장면</h2>
    <p class="fine">정답이 아니라 「여기 봐」예요. 판단은 직접 해 보고, 막히면 디스코드에서 편하게 물어보세요</p>
    <div id="cards"></div>

    <div class="row" style="margin-top:16px">
      <button type="button" id="share">장면 링크 보내기</button>
      <button type="button" id="saveImg">지도 이미지 저장</button>
      <a class="chip" href="https://mriacademy.gg/discord" target="_blank" rel="noopener">디스코드</a>
    </div>

    <div class="survey">
      <p>이 복기가 유료라면 쓸 건가요?</p>
      <div class="row" role="group" aria-label="유료 의향">
        <button type="button" data-survey="yes">쓴다</button>
        <button type="button" data-survey="maybe">모르겠다</button>
        <button type="button" data-survey="no">안 쓴다</button>
      </div>
      <p class="thanks" id="surveyThanks" hidden>답해 줘서 고마워요</p>
    </div>
    <p class="fine">상대 팀 닉네임은 「적 1」처럼 가려서 보여 줘요. 배그 공식 API 데이터로 그려요</p>
  </section>
</main>

<script src="replay-core.js"></script>
<script src="replay-cards.js"></script>
<script>
(function () {
  "use strict";
  const R = window.MRIReplay, CARDS = window.MRICards;
  const $ = (id) => document.getElementById(id);
  // API 주소 — 운영 서버. 이 기기에서 시험할 때만(localhost) ?api= 로 바꿀 수 있다
  const qs = new URLSearchParams(location.search);
  const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const API = (local && qs.get("api")) || "https://mri-academy-production.up.railway.app";
  const cv = $("map"), ctx = cv.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const C = (n) => css.getPropertyValue(n).trim();
  const MATE = [C("--gold"), C("--mate1"), C("--mate2"), C("--mate3")];

  // ── 익명 id(이 브라우저에만 · 이름 · 기기 정보 없음) ──
  let anon = null;
  try { anon = localStorage.getItem("replay.anon"); } catch {}
  if (!anon || !/^[A-Za-z0-9_-]{16,40}$/.test(anon)) {
    const a = new Uint8Array(12); crypto.getRandomValues(a);
    anon = "r" + Array.from(a, (b) => b.toString(16).padStart(2, "0")).join("");
    try { localStorage.setItem("replay.anon", anon); } catch {}
  }
  function track(kind, extra) {
    const body = JSON.stringify(Object.assign({ anon, kind }, extra || {}));
    fetch(API + "/api/replay/event", { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true }).catch(() => {});
  }
  track("visit");

  // ── 1단계 · 닉네임 → 최근 경기 ──
  let platform = "steam", who = "", matchId = null;
  document.querySelectorAll("[data-plat]").forEach((b) => b.onclick = () => {
    platform = b.dataset.plat;
    document.querySelectorAll("[data-plat]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  const say = (el, text) => { el.textContent = text; el.hidden = !text; };
  function errText(code, retry) {
    return {
      bad_request: "닉네임은 영문 · 숫자 · _ · - 로 2~32자예요. 한 번 볼까요?",
      not_found: "닉네임을 못 찾았어요. 대소문자와 플랫폼(스팀 · 카카오)을 한 번 볼까요?",
      busy: `지금 조회가 몰려서 잠깐 줄 서 있어요. ${retry || 60}초 뒤에 다시 눌러 주세요`,
      not_in_match: "이 경기에서 그 닉네임을 못 찾았어요. 닉네임을 바꾼 적이 있나요?",
      no_telemetry: "이 경기는 공식 서버에서 기록이 지워졌어요. 경기 기록은 14일 동안만 남아요",
      map_unsupported: "이 지도는 아직 그릴 수 없어요. 다른 경기를 골라 볼까요?",
      pubg_disabled: "잠깐 문제가 생겼어요. 정상으로 돌아오는 중이에요, 잠시 후 다시 열어 보세요",
    }[code] || "잠깐 문제가 생겼어요. 잠시 후 다시 해볼까요? 계속 안 되면 디스코드에서 편하게 물어보세요";
  }
  async function getJSON(path) {
    let r;
    try { r = await fetch(API + path); } catch { throw { text: "연결이 잠깐 끊겼어요. 인터넷을 확인하고 다시 해볼까요?" }; }
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw { text: errText(body.error, body.retryAfter) };
    return body;
  }
  const kst = (iso) => {
    const d = new Date(Date.parse(iso) + 9 * 3600e3);
    return `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")}`;
  };
  async function findMatches(e) {
    if (e) e.preventDefault();
    who = $("name").value.trim();
    if (!who) return;
    $("go").disabled = true; say($("findMsg"), "최근 경기를 불러오고 있어요. 조금 걸릴 수 있어요");
    $("matches").innerHTML = "";
    try {
      const r = await getJSON(`/api/replay/recent?name=${encodeURIComponent(who)}&platform=${platform}`);
      who = r.player.name || who;
      if (!r.matches.length) { say($("findMsg"), "최근 14일 안에 끝난 경기가 없어요. 한 판 하고 다시 와 주세요 🎮"); return; }
      say($("findMsg"), "");
      for (const m of r.matches) {
        const li = document.createElement("li"), b = document.createElement("button");
        b.type = "button"; b.disabled = !m.playable;
        const main = document.createElement("span"); main.className = "m-main";
        const top = document.createElement("span"); top.textContent = `${m.mapLabel} · ${modeLabel(m.gameMode)}`;
        const tag = document.createElement("span"); tag.className = "tag" + (m.matchType === "competitive" ? " comp" : ""); tag.textContent = m.typeLabel;
        top.appendChild(tag);
        const sub = document.createElement("span"); sub.className = "m-sub";
        sub.textContent = `${kst(m.createdAt)} · ${m.kills ?? 0}킬 · 딜 ${m.damage ?? 0}` + (m.playable ? "" : " · 아직 그릴 수 없는 지도예요");
        main.append(top, sub);
        const rank = document.createElement("span"); rank.className = "m-rank"; rank.textContent = m.rank ? `#${m.rank}` : "-";
        b.append(main, rank);
        b.onclick = () => openMatch(m.id);
        li.appendChild(b); $("matches").appendChild(li);
      }
    } catch (err) { say($("findMsg"), err.text || errText()); }
    finally { $("go").disabled = false; }
  }
  const modeLabel = (g) => ({ "squad-fpp": "스쿼드 1인칭", squad: "스쿼드 3인칭", "duo-fpp": "듀오 1인칭", duo: "듀오 3인칭", "solo-fpp": "솔로 1인칭", solo: "솔로 3인칭" })[g] || g || "";
  $("find").addEventListener("submit", findMatches);

  // ── 2단계 · 다시보기 ──
  let P = null, deck = null, t = 0, speed = 10, playing = false, last = 0;
  let view = { s: 1, ox: 0, oy: 0 }, follow = false, W = 0, H = 0, dpr = 1;
  const colorOf = {}; let landed = {};
  const deckReady = fetch("replay-cards.json").then((r) => r.json()).then((d) => { deck = d; }).catch(() => { deck = { cards: [] }; });

  async function openMatch(id, at) {
    matchId = id;
    say($("findMsg"), "경기 데이터를 받고 있어요. 첫 조회는 10초쯤 걸릴 수 있어요");
    try {
      const data = await getJSON(`/api/replay/match/${id}?name=${encodeURIComponent(who)}&platform=${platform}`);
      await deckReady;
      P = data;
      say($("findMsg"), "");
      $("step-find").hidden = true; $("step-view").hidden = false;
      P.team.members.forEach((m, i) => { colorOf[m.accountId] = m.isTarget ? MATE[0] : MATE[1 + ((i - 1 + 3) % 3)]; });
      landed = Object.fromEntries(P.landings.map((l) => [l.accountId, l.t]));
      $("meta").textContent = `${P.match.mapLabel} · ${P.match.typeLabel} · ${P.team.rank ? P.team.rank + "등" : "순위 없음"} · ${kst(P.match.createdAt)}`;
      $("seek").max = P.match.duration;
      resize(); buildPhases(); buildLegend(); buildCards(); buildTicks();
      seek(at != null ? at : (P.landings[0] ? P.landings[0].t - 5 : 0));
      setHash();
      track("open", { match: id });
      window.scrollTo({ top: 0 });
    } catch (err) { say($("findMsg"), err.text || errText()); }
  }
  $("back").onclick = () => { playing = false; $("play").textContent = "재생"; $("step-view").hidden = true; $("step-find").hidden = false; history.replaceState(null, "", location.pathname + location.search); };

  const sx = (x) => (x / P.match.mapSize) * W * view.s + view.ox;
  const sy = (y) => (y / P.match.mapSize) * H * view.s + view.oy;
  const sr = (r) => (r / P.match.mapSize) * W * view.s;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
    if (!W) return;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function clamp() {
    view.ox = Math.max(Math.min(0, W - W * view.s), Math.min(0, view.ox));
    view.oy = Math.max(Math.min(0, H - H * view.s), Math.min(0, view.oy));
  }
  function zoomAt(k, cx, cy) {
    const s = Math.max(1, Math.min(24, view.s * k)); k = s / view.s;
    view.ox = cx - (cx - view.ox) * k; view.oy = cy - (cy - view.oy) * k; view.s = s; clamp();
  }
  function centerOn(x, y) { view.ox = W / 2 - (x / P.match.mapSize) * W * view.s; view.oy = H / 2 - (y / P.match.mapSize) * H * view.s; clamp(); }
  function centerOnMe() { const p = R.positionAt(P.tracks.me, t) || P.tracks.me[0]; if (p) centerOn(p.x, p.y); }

  const pts = new Map(); let pinch = null, lastTap = 0;
  cv.addEventListener("pointerdown", (e) => {
    cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] }; }
    const now = Date.now(); if (pts.size === 1 && now - lastTap < 280) { zoomAt(2, e.offsetX, e.offsetY); draw(); } lastTap = now;
  });
  cv.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      view.ox += m[0] - pinch.m[0]; view.oy += m[1] - pinch.m[1];
      zoomAt(d / (pinch.d || d), m[0], m[1]); pinch = { d, m };
    } else if (pts.size === 1) {
      view.ox += e.offsetX - prev[0]; view.oy += e.offsetY - prev[1]; clamp();
      if (follow) { follow = false; $("follow").setAttribute("aria-pressed", "false"); }
    }
    draw();
  });
  const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.offsetX, e.offsetY); draw(); }, { passive: false });

  function draw() {
    if (!P || !W) return;
    ctx.fillStyle = C("--surface-1"); ctx.fillRect(0, 0, W, H);
    grid(); places();
    const z = R.zoneAt(P.zones, t);
    if (z) {
      if (z.red) { ctx.fillStyle = "rgba(255,90,79,.16)"; circ(z.red, true); }
      if (z.blue) { ctx.strokeStyle = C("--blue"); ctx.lineWidth = 2; circ(z.blue); }
      if (z.white) { ctx.strokeStyle = C("--white-zone"); ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]); circ(z.white); ctx.setLineDash([]); }
    }
    trails(); fights(); dots(); hud(z);
  }
  function circ(c, fill) { ctx.beginPath(); ctx.arc(sx(c.x), sy(c.y), sr(c.r), 0, Math.PI * 2); fill ? ctx.fill() : ctx.stroke(); }
  function line(a, b, c, d) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); }
  function grid() {
    const km = 100000, n = Math.round(P.match.mapSize / km);
    ctx.lineWidth = 1;
    if (view.s >= 4) { ctx.strokeStyle = "rgba(255,255,255,.035)"; for (let i = 0; i <= n * 10; i++) { line(sx(i * km / 10), 0, sx(i * km / 10), H); line(0, sy(i * km / 10), W, sy(i * km / 10)); } }
    ctx.strokeStyle = "rgba(255,255,255,.09)";
    for (let i = 0; i <= n; i++) { line(sx(i * km), 0, sx(i * km), H); line(0, sy(i * km), W, sy(i * km)); }
  }
  function places() {
    ctx.font = `600 ${view.s >= 3 ? 12 : 10}px ${C("--body")}`; ctx.fillStyle = "rgba(236,236,241,.42)"; ctx.textAlign = "center";
    for (const k in P.places) { const [x, y, label] = P.places[k]; ctx.fillText(label, sx(x), sy(y)); }
    ctx.textAlign = "left";
  }
  const deathOf = (id) => { const d = P.combat.find((c) => c.type === "death" && c.target === id); return d ? d.t : null; };
  function trails() {
    for (const m of P.team.members) {
      const tr = P.tracks[m.accountId]; if (!tr || !tr.length) continue;
      const end = Math.min(t, deathOf(m.accountId) ?? Infinity);
      ctx.strokeStyle = colorOf[m.accountId]; ctx.globalAlpha = m.isTarget ? .9 : .55; ctx.lineWidth = m.isTarget ? 2 : 1.5;
      ctx.beginPath(); let started = false;
      for (const p of tr) {
        if (p.t > end) break;
        if (p.t < (landed[m.accountId] ?? 0) || p.vehicle === "TransportAircraft") continue;
        started ? ctx.lineTo(sx(p.x), sy(p.y)) : ctx.moveTo(sx(p.x), sy(p.y)); started = true;
      }
      const now = R.positionAt(tr, end); if (started && now) ctx.lineTo(sx(now.x), sy(now.y));
      ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
  // 지도 위 이름표 — 앞 4글자, 팀원끼리 겹치면 뒤 4글자
  const short = (n) => {
    const head = (x) => [...(x || "")].slice(0, 4).join("");
    return P.team.members.filter((m) => head(m.name) === head(n)).length > 1 ? [...(n || "")].slice(-4).join("") : head(n);
  };
  function cross(x, y, r) { line(x - r, y - r, x + r, y + r); line(x - r, y + r, x + r, y - r); }
  function dots() {
    for (const m of P.team.members) {
      const p = R.positionAt(P.tracks[m.accountId], t); if (!p) continue;
      const d = deathOf(m.accountId), x = sx(p.x), y = sy(p.y);
      if (d != null && t >= d) { ctx.strokeStyle = C("--red"); ctx.lineWidth = 2; cross(x, y, 5); continue; }
      const r = m.isTarget ? 6 : 5;
      ctx.fillStyle = colorOf[m.accountId]; ctx.beginPath();
      if (p.vehicle && p.vehicle !== "TransportAircraft") ctx.rect(x - r, y - r, r * 2, r * 2); else ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill(); ctx.strokeStyle = C("--bg"); ctx.lineWidth = 1.5; ctx.stroke();
      if (p.inBlue) { ctx.strokeStyle = C("--blue"); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r + 4, 0, Math.PI * 2); ctx.stroke(); }
      if (view.s >= 3) { ctx.fillStyle = C("--ink"); ctx.font = `600 11px ${C("--num")}`; ctx.fillText(short(m.name), x + 8, y - 6); }
    }
  }
  function fights() {
    const win = 20;
    for (const c of P.combat) {
      if (c.t > t) break;
      if (t - c.t > win || c.x == null) continue;
      const a = 1 - (t - c.t) / win, col = c.side === "ours" ? C("--gold") : c.side === "theirs" ? C("--red") : C("--muted");
      ctx.globalAlpha = Math.max(.15, a);
      if (c.type === "attack") { ctx.fillStyle = col; ctx.fillRect(sx(c.x) - 1, sy(c.y) - 1, 2, 2); }
      else if (c.tx != null) {
        ctx.strokeStyle = col; ctx.lineWidth = c.type === "damage" ? 1 : 2;
        line(sx(c.x), sy(c.y), sx(c.tx), sy(c.ty));
        if (c.type === "groggy" || c.type === "kill" || c.type === "death") {
          ctx.lineWidth = 2; const x = sx(c.tx), y = sy(c.ty);
          if (c.type === "groggy") { ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.stroke(); } else cross(x, y, 7);
        }
      }
      ctx.globalAlpha = 1;
    }
  }
  const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const gun = (w) => w.replace(/^Weap/, "").replace(/^Proj/, "").replace(/_C(_\d+)?$/, "").replace(/^Player(Male|Female)_A$/, "주먹");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function hud(z) {
    const ph = [...P.phases].reverse().find((p) => p.t <= t);
    $("phase").textContent = ph ? ph.label : (t < (P.landings[0] ? P.landings[0].t : 0) ? "비행기 · 낙하" : "원 공개 전");
    $("alive").textContent = z ? `생존 ${z.alivePlayers}명 · ${z.aliveTeams}팀` : "생존 -";
    $("time").textContent = `${mmss(t)} / ${mmss(P.match.duration)}`;
    $("seek").value = t; $("fill").style.width = (t / P.match.duration * 100) + "%";
    const c = [...P.combat].reverse().find((x) => x.t <= t && t - x.t < 8 && x.type !== "attack" && x.type !== "damage");
    const toast = $("toast");
    if (c) {
      const how = [c.weapon && gun(c.weapon), c.distance ? Math.round(c.distance / 100) + "m" : ""].filter(Boolean).join(" · ");
      const verb = { groggy: "기절시킴", kill: "처치", death: "처치", revive: "일으킴" }[c.type];
      toast.innerHTML = `${mmss(c.t)} <b class="${c.side}">${esc(c.actorName || "자기장")}</b> → <b>${esc(c.targetName || "")}</b> ${verb}${how ? ` <span style="color:var(--muted)">${esc(how)}</span>` : ""}`;
    } else toast.textContent = "";
    toast.hidden = !toast.textContent;
  }
  function seek(tt) { t = Math.max(0, Math.min(P.match.duration, tt)); if (follow) centerOnMe(); draw(); }
  function jumpTo(tt, x, y) {
    if (view.s < 4) { view.s = 1; view.ox = view.oy = 0; zoomAt(6, W / 2, H / 2); }
    seek(tt);
    if (x != null) centerOn(x, y); else centerOnMe();
    draw();
  }
  // 카드 장면 — 원 · 자기장 카드는 수축이 시작된 뒤를, 교전 카드는 5초 전을 보여 주고 나 · 팀원(+ 다음 원)이 한 화면에 들어오게 맞춘다
  const ZONE_CARD = /shrink|blue|move-wait|death|edge/;
  function showScene(c) {
    const zoneCard = ZONE_CARD.test(c.id);
    seek(Math.max(0, zoneCard ? c.t + 3 : c.t - 5));
    const box = [];
    for (const m of P.team.members) {
      const d = deathOf(m.accountId); if (d != null && d < t) continue;
      const p = R.positionAt(P.tracks[m.accountId], t); if (p) box.push([p.x, p.y]);
    }
    const z = R.zoneAt(P.zones, t), w = z && (z.white || z.blue);
    if (zoneCard && w) box.push([w.x - w.r, w.y - w.r], [w.x + w.r, w.y + w.r]);
    if (!box.length) return jumpTo(t);
    fitBox(box, 30000);
  }
  // 점들이 한 화면에 들어오게 — minSpan(cm) 보다 좁게는 안 당긴다
  function fitBox(box, minSpan) {
    const xs = box.map((b) => b[0]), ys = box.map((b) => b[1]);
    const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), minSpan) * 1.25;
    view = { s: 1, ox: 0, oy: 0 }; zoomAt(Math.min(24, P.match.mapSize / span), W / 2, H / 2);
    centerOn((Math.max(...xs) + Math.min(...xs)) / 2, (Math.max(...ys) + Math.min(...ys)) / 2); draw();
  }
  function jumpFight(dir) {
    const list = P.combat.filter((c) => c.type === "groggy" || c.type === "kill" || c.type === "death");
    const c = dir > 0 ? list.find((x) => x.t > t + 4) : [...list].reverse().find((x) => x.t < t - 4);
    if (!c) return;
    // 교전 — 쏜 자리 · 맞은 자리 + 300m 안의 살아 있는 팀원이 한 화면에(최소 폭 250m)
    seek(c.t + 1);
    const box = [[c.x, c.y], [c.tx ?? c.x, c.ty ?? c.y]];
    for (const m of P.team.members) {
      const d = deathOf(m.accountId); if (d != null && d < c.t) continue;
      const p = R.positionAt(P.tracks[m.accountId], c.t);
      if (p && Math.hypot(p.x - c.x, p.y - c.y) < 30000) box.push([p.x, p.y]);
    }
    fitBox(box, 25000);
  }
  function buildTicks() {
    const tr = $("track"); tr.querySelectorAll(".tick").forEach((n) => n.remove());
    const add = (tt, cls) => { const d = document.createElement("i"); d.className = "tick " + cls; d.style.left = (tt / P.match.duration * 100) + "%"; tr.appendChild(d); };
    P.phases.forEach((p) => add(p.t, "phase"));
    P.combat.filter((c) => c.type === "groggy" || c.type === "kill" || c.type === "death").forEach((c) => add(c.t, c.side === "ours" ? "ours" : "theirs"));
  }
  function buildPhases() {
    const box = $("phases"); box.innerHTML = "";
    const add = (label, tt) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.onclick = () => seek(tt); box.appendChild(b); };
    if (P.landings.length) add("착지", Math.max(0, P.landings[0].t - 3));
    P.phases.forEach((p) => add(p.label.replace("페이즈 ", "P "), p.t + 10));
  }
  function buildLegend() {
    const L = $("legend"); L.innerHTML = "";
    P.team.members.forEach((m) => { const s = document.createElement("span"); s.innerHTML = `<i style="background:${colorOf[m.accountId]}"></i>${esc(m.name)}${m.isTarget ? " (나)" : ""}`; L.appendChild(s); });
    [["--blue", "파란 원"], ["--white-zone", "다음 원"], ["--red", "당한 교전 · 사망"]].forEach(([v, n]) => { const s = document.createElement("span"); s.innerHTML = `<i style="background:${C(v)}"></i>${n}`; L.appendChild(s); });
  }

  // ── 카드 3장(카드 글 + 경기 숫자만) ──
  function buildCards() {
    const box = $("cards"); box.innerHTML = "";
    const r = CARDS.pick(P, deck, 3);
    if (!r.cards.length) { box.innerHTML = '<p class="fine">이 경기에서는 짚을 장면을 못 찾았어요. 다른 경기도 열어 볼까요?</p>'; return; }
    for (const c of r.cards) {
      const el = document.createElement("div"); el.className = "card";
      el.innerHTML = `<div class="k"><span><b>${esc(c.concept)}</b> · ${esc(c.title)}</span><span>${c.t != null ? mmss(c.t) : ""}</span></div>
        <p>${esc(c.text)}</p><p class="ask">${esc(c.ask)}</p>
        <div class="row">${c.t != null ? '<button type="button" data-act="scene">이 장면 보기</button>' : ""}
          <button type="button" data-act="yes" aria-pressed="false">맞아요</button><button type="button" data-act="no" aria-pressed="false">아니에요</button></div>`;
      el.querySelector('[data-act="scene"]')?.addEventListener("click", () => { showScene(c); $("map").scrollIntoView({ block: "center" }); });
      for (const v of ["yes", "no"]) el.querySelector(`[data-act="${v}"]`).addEventListener("click", (ev) => {
        el.querySelectorAll('[data-act="yes"],[data-act="no"]').forEach((b) => b.setAttribute("aria-pressed", String(b === ev.currentTarget)));
        track("vote", { card: c.id, value: v, match: matchId });
      });
      box.appendChild(el);
      const tr = $("track"), d = document.createElement("i"); d.className = "tick card"; if (c.t != null) { d.style.left = (c.t / P.match.duration * 100) + "%"; tr.appendChild(d); }
    }
  }
  document.querySelectorAll("[data-survey]").forEach((b) => b.onclick = () => {
    document.querySelectorAll("[data-survey]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    $("surveyThanks").hidden = false;
    track("survey", { value: b.dataset.survey, match: matchId });
  });

  // ── 공유 — 장면 링크(닉네임 · 경기 · 시각) · 지도 이미지(상대 닉네임은 지도에 원래 없다) ──
  function setHash() { history.replaceState(null, "", `${location.pathname}${location.search}#p=${platform}&n=${encodeURIComponent(who)}&m=${matchId}&t=${Math.round(t)}`); }
  $("share").onclick = async () => {
    setHash();
    const url = location.href;
    track("share", { match: matchId });
    try {
      if (navigator.share) await navigator.share({ title: "경기 복기", url });
      else { await navigator.clipboard.writeText(url); $("toast").hidden = false; $("toast").textContent = "링크를 복사했어요"; }
    } catch {}
  };
  $("saveImg").onclick = () => {
    track("image", { match: matchId });
    cv.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `replay-${mmss(t).replace(":", "")}.png`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, "image/png");
  };

  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "멈춤" : "재생"; $("play").setAttribute("aria-label", playing ? "멈춤" : "재생"); last = 0; if (playing) requestAnimationFrame(tick); };
  $("seek").oninput = (e) => seek(Number(e.target.value));
  document.querySelectorAll("[data-speed]").forEach((b) => b.onclick = () => {
    speed = Number(b.dataset.speed);
    document.querySelectorAll("[data-speed]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  $("follow").onclick = () => { follow = !follow; $("follow").setAttribute("aria-pressed", String(follow)); if (follow) { if (view.s < 3) zoomAt(4 / view.s, W / 2, H / 2); centerOnMe(); draw(); } };
  $("reset").onclick = () => { follow = false; $("follow").setAttribute("aria-pressed", "false"); view = { s: 1, ox: 0, oy: 0 }; draw(); };
  $("prevFight").onclick = () => jumpFight(-1);
  $("nextFight").onclick = () => jumpFight(1);
  function tick(now) {
    if (!playing) return;
    if (last) seek(t + (now - last) / 1000 * speed);
    last = now;
    if (t >= P.match.duration) { playing = false; $("play").textContent = "재생"; return; }
    requestAnimationFrame(tick);
  }
  window.addEventListener("resize", resize);

  // 장면 링크로 들어오면 바로 그 경기 · 그 시각
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("n") && /^[0-9a-f-]{36}$/i.test(h.get("m") || "")) {
    platform = h.get("p") === "kakao" ? "kakao" : "steam";
    document.querySelectorAll("[data-plat]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.plat === platform)));
    who = h.get("n"); $("name").value = who;
    const at = Number(h.get("t"));
    openMatch(h.get("m"), Number.isFinite(at) ? at : null).then(() => { if (Number.isFinite(at) && P) { jumpTo(at); } });
  }
})();
</script>
</body>
</html>
