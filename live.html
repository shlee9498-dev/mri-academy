<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>G드컵 · 라이브 킬 트래커</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#0a0a0c;--card:#16161c;--elev:#1d1d25;--line:#27272a;--ink:#f4f4f5;--dim:#a1a1aa;--faint:#71717a;
    --gold:#f5c518;--green:#10b981;--red:#e63946;--display:'Archivo Black',sans-serif;--body:'Pretendard Variable',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;padding:0 12px 40px;
    -webkit-user-select:none;user-select:none;}
  .wrap{max-width:900px;margin:0 auto;}
  .top{position:sticky;top:0;background:rgba(10,10,12,.96);backdrop-filter:blur(8px);padding:12px 0 10px;z-index:5;border-bottom:1px solid var(--line);}
  .kick{font-family:var(--display);letter-spacing:.28em;color:var(--gold);font-size:11px;}
  h1{font-size:19px;font-weight:800;margin:3px 0 8px;}
  .warn{border:1px solid var(--gold);background:rgba(245,197,24,.08);border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.55;margin:8px 0;}
  .tabs{display:flex;gap:6px;}
  .tabs button{flex:1;background:var(--elev);border:1px solid var(--line);color:var(--ink);font-family:var(--body);
    font-weight:800;font-size:16px;padding:12px 4px;border-radius:10px;cursor:pointer;}
  .tabs button.on{background:var(--gold);color:#1a1500;border-color:var(--gold);}
  .bar{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:12px;color:var(--faint);}
  .bar a{color:var(--dim);text-decoration:none;}
  .bar a:hover{color:var(--gold);}
  .reset{margin-left:auto;background:none;border:1px solid var(--line);color:var(--faint);border-radius:8px;
    padding:7px 12px;font-size:12px;font-family:var(--body);cursor:pointer;}
  .reset:hover{border-color:var(--red);color:var(--red);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:9px;margin-top:11px;}
  .t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;}
  .t.out{opacity:.42;}
  .th{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .chip{font-family:var(--display);font-size:12px;letter-spacing:.06em;padding:4px 7px;border-radius:5px;flex:0 0 auto;}
  .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .n{font-family:var(--display);font-size:30px;line-height:1;color:var(--gold);min-width:44px;text-align:center;}
  .t.out .n{color:var(--faint);}
  .ops{display:grid;grid-template-columns:1fr 60px 1fr;gap:8px;align-items:center;}
  .k{border:none;border-radius:10px;font-family:var(--display);font-size:22px;padding:16px 0;cursor:pointer;
    touch-action:manipulation;}
  .plus{background:var(--gold);color:#1a1500;}
  .minus{background:var(--elev);color:var(--dim);border:1px solid var(--line);}
  .k:active{transform:scale(.96);}
  .wipe{width:100%;margin-top:8px;background:none;border:1px solid var(--line);color:var(--faint);
    border-radius:9px;padding:10px;font-size:13px;font-weight:700;font-family:var(--body);cursor:pointer;}
  .wipe.on{border-color:var(--red);color:var(--red);background:rgba(230,57,70,.09);}
  .msg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--elev);border:1px solid var(--line);
    padding:10px 17px;border-radius:10px;font-size:14px;display:none;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .msg.show{display:block;}
  .gate{max-width:380px;margin:80px auto;text-align:center;}
  .gate input{background:var(--elev);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    padding:11px;font-size:15px;font-family:var(--body);width:100%;margin:14px 0;}
  .gate button{background:var(--gold);color:#1a1500;border:none;font-weight:800;padding:12px 22px;border-radius:10px;cursor:pointer;}
  .note{font-size:12px;color:var(--faint);margin:9px 2px;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <div class="gate" id="gate">
    <div class="kick">G드컵</div>
    <h1>라이브 트래커 — 관리자 확인</h1>
    <input type="password" id="keyInput" placeholder="관리자 키">
    <div><button id="keyBtn">입장</button></div>
    <div class="note" id="gateMsg"></div>
  </div>

  <div id="app" class="hidden">
    <div class="top">
      <div class="kick" id="kick">G드컵</div>
      <h1>라이브 킬 트래커 <span style="font-weight:600;font-size:13px;color:var(--faint);">비공식</span></h1>
      <!-- 이 화면과 확정 저장은 별개 트랙이다. 여기 숫자가 판정에 들어간다고 오해하면
           라운드 종료 후 gdcup-score 대조를 건너뛰게 된다 — 그래서 맨 위에 못박는다. -->
      <div class="warn">
        ⚠ <b>여기 숫자는 방송용 참고값입니다.</b> 확정 점수는 라운드가 끝난 뒤
        <a href="gdcup-score.html" style="color:var(--gold);">점수 입력</a>에서 따로 저장해야 반영됩니다 —
        이 화면은 정본(<code>gdcup_scores</code>)에 아무것도 쓰지 않습니다.
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="bar">
        <span id="stat">—</span>
        <a href="live-board.html" target="_blank">보드 열기 ↗</a>
        <button class="reset" id="resetBtn">이 라운드 리셋</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="note">킬은 눌렀을 때 서버에서 더합니다 — 연타하거나 신호가 끊겼다 붙어도 숫자가 밀리지 않습니다.</div>
  </div>

</div>
<div class="msg" id="msg"></div>

<script>
(function(){
  "use strict";
  var GAPI = "https://mri-academy-production.up.railway.app";
  var KEYNAME = "gdcupKey";
  var ROUNDS = [1,2,3,4,5];
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function key(){ return sessionStorage.getItem(KEYNAME) || ""; }
  var season = 3, round = 1, TEAMS = [], BRAND = {}, LIVE = {}, gated = false;
  var msgTimer = null;
  function toast(t){ var m=$("msg"); m.textContent=t; m.classList.add("show");
    clearTimeout(msgTimer); msgTimer=setTimeout(function(){ m.classList.remove("show"); }, 2200); }
  function toGate(t){
    if(gated) return; gated = true;
    try{ sessionStorage.removeItem(KEYNAME); }catch(e){}
    $("app").classList.add("hidden"); $("gate").classList.remove("hidden");
    $("keyInput").value=""; $("gateMsg").textContent = t || "🔑 관리자 키가 만료됐습니다.";
  }

  // 색 대비 — 흰 태그칩에 흰 글씨가 되지 않게. results·overlay와 같은 규칙.
  function textOn(hex){
    var h=String(hex||"").replace("#",""); if(h.length!==6) return "#0a0a0c";
    var r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
    return (r*299+g*587+b*114)/1000 > 150 ? "#0a0a0c" : "#f4f4f5";
  }
  function tagOf(name){
    var b=BRAND[name];
    if(b && b.tag) return String(b.tag).toUpperCase().slice(0,4);
    return String(name||"").replace(/\s+/g,"").slice(0,2) || "?";
  }
  function colorOf(name){ var b=BRAND[name]; return (b && b.color) || "#3f3f46"; }

  function renderTabs(){
    $("tabs").innerHTML = ROUNDS.map(function(r){
      return '<button data-r="'+r+'" class="'+(r===round?"on":"")+'">R'+r+'</button>'; }).join("");
    Array.prototype.forEach.call($("tabs").querySelectorAll("button"), function(b){
      b.addEventListener("click", function(){ round = Number(b.getAttribute("data-r")); renderTabs(); loadLive(); });
    });
  }
  function renderGrid(){
    $("grid").innerHTML = TEAMS.map(function(t){
      var st = LIVE[t.team_name] || {};
      var col = colorOf(t.team_name);
      return '<div class="t'+(st.wiped?" out":"")+'" data-t="'+esc(t.team_name)+'">'
        + '<div class="th">'
          + '<span class="chip" style="background:'+esc(col)+';color:'+textOn(col)+'">'+esc(tagOf(t.team_name))+'</span>'
          + '<span class="nm">'+esc(t.team_name)+'</span>'
          + '<span class="n">'+(Number(st.kills)||0)+'</span>'
        + '</div>'
        + '<div class="ops">'
          + '<button class="k minus" data-d="-1">−</button>'
          + '<div style="text-align:center;font-size:11px;color:var(--faint);">킬</div>'
          + '<button class="k plus" data-d="1">+</button>'
        + '</div>'
        // 전멸 표시엔 이모지를 쓰지 않는다 — OBS·구형 안드로이드에서 두부(□)로 뜬다
        + '<button class="wipe'+(st.wiped?" on":"")+'">'+(st.wiped?"전멸 — 해제하기":"전멸 표시")+'</button>'
        + '</div>';
    }).join("");
    Array.prototype.forEach.call($("grid").querySelectorAll(".t"), function(card){
      var name = card.getAttribute("data-t");
      Array.prototype.forEach.call(card.querySelectorAll(".k"), function(b){
        b.addEventListener("click", function(){ send(name, { delta: Number(b.getAttribute("data-d")) }); });
      });
      card.querySelector(".wipe").addEventListener("click", function(){
        var st = LIVE[name] || {};
        send(name, { wiped: !st.wiped });
      });
    });
    var wiped = TEAMS.filter(function(t){ return (LIVE[t.team_name]||{}).wiped; }).length;
    var kills = TEAMS.reduce(function(s,t){ return s + (Number((LIVE[t.team_name]||{}).kills)||0); }, 0);
    $("stat").textContent = "R"+round+" · 생존 "+(TEAMS.length-wiped)+"/"+TEAMS.length+" · 총 "+kills+"킬";
  }

  function send(name, patch){
    var st = LIVE[name] || (LIVE[name] = { kills:0, wiped:false });
    // 낙관적 반영 — 방송 중에 버튼이 굼뜨면 안 된다. 실패하면 서버 값으로 되돌린다.
    if(patch.delta!=null) st.kills = Math.max(0, (Number(st.kills)||0) + patch.delta);
    if(patch.wiped!=null) st.wiped = patch.wiped;
    renderGrid();
    var body = { season:season, round:round, team_name:name };
    if(patch.delta!=null) body.delta = patch.delta;
    if(patch.wiped!=null) body.wiped = patch.wiped;
    fetch(GAPI+"/api/gdcup-live", { method:"POST",
      headers:{ "Content-Type":"application/json", "x-admin-key":key() }, body:JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ return {s:r.status,d:d}; }); })
      .then(function(res){
        if(res.s===401){ toGate(); return; }
        if(!res.d || !res.d.ok){ toast("저장 실패 — 다시 눌러주세요"); loadLive(); return; }
        LIVE[name] = { kills: Number(res.d.row.kills)||0, wiped: res.d.row.wiped===true };
        renderGrid();
      })
      .catch(function(){ toast("네트워크 오류 — 다시 눌러주세요"); loadLive(); });
  }

  function loadTeams(){
    return fetch(GAPI+"/api/gdcup-list").then(function(r){ return r.json(); }).then(function(d){
      TEAMS = ((d && d.teams) || []).filter(function(t){ return t.status === "confirmed"; });
    });
  }
  function loadBrands(){
    return fetch(GAPI+"/api/gdcup-team-brands").then(function(r){ return r.json(); }).then(function(d){
      BRAND = {};
      ((d && d.brands) || []).forEach(function(b){
        if(!Object.prototype.hasOwnProperty.call(BRAND, b.team_name)) BRAND[b.team_name] = b;
      });
    }).catch(function(){ BRAND = {}; });
  }
  function loadMeta(){
    return fetch(GAPI+"/api/gdcup-meta").then(function(r){ return r.json(); }).then(function(d){
      if(d && d.currentSeason) season = Number(d.currentSeason);
      $("kick").textContent = "G드컵 시즌 " + season;
    }).catch(function(){});
  }
  function loadLive(){
    return fetch(GAPI+"/api/gdcup-live?season="+season+"&round="+round, { headers:{ "x-admin-key":key() } })
      .then(function(r){
        if(r.status===401){ toGate(); return null; }
        return r.json();
      })
      .then(function(d){
        if(!d) return;
        LIVE = {};
        (d.rows||[]).forEach(function(r){ LIVE[r.team_name] = { kills:Number(r.kills)||0, wiped:r.wiped===true }; });
        renderGrid();
      }).catch(function(){ toast("불러오기 실패"); });
  }

  $("resetBtn").addEventListener("click", function(){
    if(!confirm("R"+round+" 라이브 카운트를 전부 지웁니다.\n\n확정 점수(gdcup_scores)는 영향 없습니다. 계속할까요?")) return;
    fetch(GAPI+"/api/gdcup-live-reset", { method:"POST",
      headers:{ "Content-Type":"application/json", "x-admin-key":key() },
      body: JSON.stringify({ season:season, round:round }) })
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ return {s:r.status,d:d}; }); })
      .then(function(res){
        if(res.s===401){ toGate(); return; }
        if(res.d && res.d.ok){ toast("R"+round+" 리셋됨"); loadLive(); }
        else toast("리셋 실패");
      }).catch(function(){ toast("네트워크 오류"); });
  });

  function enter(){
    var k = $("keyInput").value.trim(); if(!k) return;
    sessionStorage.setItem(KEYNAME, k);
    gated = false;
    boot();
  }
  $("keyBtn").addEventListener("click", enter);
  $("keyInput").addEventListener("keydown", function(e){ if(e.key === "Enter") enter(); });

  function boot(){
    if(!key()){ $("gate").classList.remove("hidden"); return; }
    $("gate").classList.add("hidden"); $("app").classList.remove("hidden");
    renderTabs();
    Promise.all([loadMeta(), loadTeams(), loadBrands()]).then(function(){
      renderGrid();
      return loadLive();
    });
  }
  boot();
})();
</script>
</body>
</html>
