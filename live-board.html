<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>G드컵 S3 실시간 순위 바 (700×620)</title>
<!--
  ══ 개발자 가이드 (CD 시안 원문 유지) ═══════════════════════════
  · OBS 브라우저 소스: 700×620 고정. 페이지 배경 투명, 행만 반투명 다크
    (rgba(15,13,21,0.65)) — 게임 화면이 비쳐 보이는 오버레이용.
  · 데이터 교체 지점:
      .team-row             팀 한 줄. data-rank / data-team(태그) / data-team-name / data-alive("true"|"false")
      .team-row .rank       순위 숫자
      .team-row .team-chip  팀 컬러 칩 (style의 --team-color 교체)
      .team-row .team-name  한글 팀명 (화면 표기 기본)
      .team-row .team-tag   영문 태그 (보조, 작게)
      .team-row .pts        누적 점수
      .team-row .kills      이번 판 킬
      .rounds[data-current] 현재 라운드 (1~5), .round.on 클래스로 하이라이트
  · 상태 규칙:
      data-alive="false" → 줄 딤 + 팀명 취소선 (CSS 자동)
      data-rank="1"      → 골드 강조 (CSS 자동)

  ══ 구현 메모 ═════════════════════════════════════════════════
  · 마크업·CSS는 시안 그대로. 아래 스크립트가 실데이터를 바인딩한다.
  · 팀 색·태그는 gdcup_team_brand 실값(API `color`/`tag`) — 시안의 더미 색이 아니다.
  · 점수는 서버가 라운드마다 반올림해 정수로 준다. 시안의 "58.4"는 예시라
    소수를 만들어 붙이지 않는다(없는 정밀도를 표시하지 않는다).
  · URL 계약은 종전 그대로: ?round=N · &bg=0(투명) · &every=초(5~30).
    시안은 기본 투명이지만, 이미 배포된 OBS 설정이 bg=0을 쓰고 있으므로
    "bg=0이면 투명 / 그 외 불투명"을 유지한다.
  ═══════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:700px; height:620px; background:transparent; overflow:hidden;
    font-family:'Pretendard Variable',Pretendard,sans-serif; color:#f4f1ea; }
  body.bg-solid { background:#14121b; }

  .board { width:700px; height:620px; display:flex; flex-direction:column; gap:2px; }
  .board * { text-shadow:0 1px 3px rgba(0,0,0,0.75); }

  /* ── 헤더 ── */
  .board-header { height:50px; flex:none; display:flex; align-items:center; gap:12px;
    padding:0 14px; background:rgba(15,13,21,0.7); border-radius:8px; }
  .mark { width:26px; height:26px; border-radius:6px; background:#f5c518;
    display:grid; place-items:center; flex:none; text-shadow:none;
    font-family:Paperlogy,sans-serif; font-weight:900; font-size:17px; color:#171204; }
  .title { font-family:Paperlogy,sans-serif; font-weight:800; font-size:20px; letter-spacing:-0.3px; }
  .season { font-size:12px; font-weight:700; letter-spacing:2.5px; color:#f5c518; }
  .spacer { flex:1; }
  .rounds { display:flex; gap:4px; }
  .round { width:29px; height:21px; border-radius:5px; display:grid; place-items:center;
    font-family:Paperlogy,sans-serif; font-weight:700; font-size:12px;
    color:#9d94b1; background:rgba(255,255,255,0.08); }
  .round.on { color:#171204; background:#f5c518; text-shadow:none; }
  .live { display:flex; align-items:center; gap:7px; padding:4px 11px; border-radius:999px;
    background:rgba(230,77,70,0.2); }
  .live.off { display:none; }
  .live-dot { width:8px; height:8px; border-radius:50%; background:#e64d46;
    animation:pulse 1.6s ease-out infinite; }
  .live span { font-family:Paperlogy,sans-serif; font-weight:800; font-size:13px;
    letter-spacing:2px; color:#ff8a80; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(230,77,70,.55)}
    70%{box-shadow:0 0 0 9px rgba(230,77,70,0)} 100%{box-shadow:0 0 0 0 rgba(230,77,70,0)} }

  /* ── 컬럼 라벨 ── */
  .col-labels { height:20px; flex:none; display:grid;
    grid-template-columns:40px 10px 1fr 92px 66px; gap:10px; align-items:center;
    padding:0 14px; font-size:11px; font-weight:700; letter-spacing:2px; color:#9d94b1; }
  .col-labels .r { text-align:right; }

  /* ── 팀 줄 ── */
  /* ⚠ min-height:0 이 핵심이다. flex 아이템의 min-height 기본값은 auto 라, 자식 콘텐츠
     높이 아래로는 줄어들지 않는다 — flex:1 을 줘도 축소가 막힌다. 16팀이 되자 rows 가
     620px 를 넘겨 body 의 overflow:hidden 에 잘렸고 13위부터 화면에서 사라졌다.
     행 높이 = (620 − 50 헤더 − 20 라벨 − 4 gap − 30 행간) / 16 ≈ 32px.
     폰트·칩을 그 안에 들어가는 크기로 낮추고 line-height 를 1 로 고정해 여백을 없앤다. */
  .rows { flex:1; min-height:0; display:flex; flex-direction:column; gap:2px; }
  .team-row { flex:1 1 0; min-height:0; overflow:hidden; display:grid;
    grid-template-columns:38px 10px 1fr 84px 60px; gap:10px; align-items:center;
    padding:0 12px; background:rgba(15,13,21,0.65); border-radius:6px; }
  .rank { font-family:Paperlogy,sans-serif; font-weight:900; font-size:16px; line-height:1;
    color:#c9c2d6; font-variant-numeric:tabular-nums; }
  .team-chip { width:10px; height:16px; border-radius:3px; background:var(--team-color,#8d84a3); text-shadow:none; }
  .team-name { display:flex; align-items:baseline; gap:6px; min-width:0; }
  /* 팀명이 길어졌다("아아 한잔주세요"·"영앤리치레코즈") — 넘치면 자르고 태그는 살린다 */
  .team-name .kr { font-size:15px; line-height:1.1; font-weight:700; letter-spacing:-0.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .team-name .team-tag { font-family:Paperlogy,sans-serif; font-weight:700; font-size:10px;
    line-height:1; letter-spacing:1px; color:#8d84a3; flex:none; }
  .pts { text-align:right; font-family:Paperlogy,sans-serif; font-weight:800; font-size:16px;
    line-height:1; font-variant-numeric:tabular-nums; }
  .kills { text-align:right; font-weight:700; font-size:14px; line-height:1; color:#ff9d97;
    font-variant-numeric:tabular-nums; }

  /* 1위 골드 강조 */
  .team-row[data-rank="1"] { background:rgba(74,58,6,0.72); }
  .team-row[data-rank="1"] .rank,
  .team-row[data-rank="1"] .pts { color:#f5c518; }
  .team-row[data-rank="1"] .kr { color:#fdf6de; }

  /* 전멸 팀: 줄 딤 + 팀명 취소선 */
  .team-row[data-alive="false"] { opacity:0.4; filter:grayscale(0.7); }
  .team-row[data-alive="false"] .kr { text-decoration:line-through;
    text-decoration-thickness:2px; text-decoration-color:rgba(230,77,70,0.9); }

  /* 순위 변동 FLIP — 이전 위치에서 현재 위치로 미끄러진다 */
  .team-row.flip { transition:transform 320ms cubic-bezier(0.16,1,0.3,1); }
  @media (prefers-reduced-motion: reduce){ .team-row.flip { transition:none; } }
</style>
</head>
<body>
<div class="board">
  <div class="board-header">
    <div class="mark">G</div>
    <div class="title">G드컵</div>
    <div class="season" id="season">SEASON 3</div>
    <div class="spacer"></div>
    <div class="rounds" id="rounds" data-current="">
      <div class="round" data-r="1">R1</div>
      <div class="round" data-r="2">R2</div>
      <div class="round" data-r="3">R3</div>
      <div class="round" data-r="4">R4</div>
      <div class="round" data-r="5">R5</div>
    </div>
    <div class="live off" id="live"><span class="live-dot"></span><span>LIVE</span></div>
  </div>

  <div class="col-labels">
    <div>#</div><div></div><div>팀</div><div class="r">PTS</div><div class="r">KILLS</div>
  </div>

  <div class="rows" id="rows"></div>
</div>

<script>
(function(){
  "use strict";
  var GAPI = "https://mri-academy-production.up.railway.app";
  var Q = new URLSearchParams(location.search);
  var round = Number(Q.get("round")) || 0;      // 0이면 라이브 없이 확정분만
  var season = Q.get("season") || "";
  var every = Math.min(30, Math.max(5, Number(Q.get("every")) || 7)) * 1000;
  // 시안은 기본 투명이지만 배포된 OBS 설정이 bg=0을 쓰므로 종전 계약을 유지한다.
  if(Q.get("bg") !== "0") document.body.classList.add("bg-solid");
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  // 라운드 칩은 ?round= 를 따른다. 0이면 아무 칩도 켜지 않는다(누적 보기).
  (function(){
    $("rounds").setAttribute("data-current", round || "");
    Array.prototype.forEach.call($("rounds").children, function(el){
      el.classList.toggle("on", Number(el.getAttribute("data-r")) === round);
    });
    $("live").classList.toggle("off", !round);
  })();

  var prevTop = {};   // 팀명 → 직전 렌더의 화면상 top (FLIP용)

  function render(d){
    var teams = (d && d.teams) || [];
    var box = $("rows");
    if(!teams.length){ box.innerHTML = ""; return; }
    if(d.season) $("season").textContent = "SEASON " + d.season;

    var before = prevTop;
    var now = {};
    box.innerHTML = teams.map(function(t, i){
      var col = t.color || "#8d84a3";
      var tag = t.tag || "";
      // 태그가 팀명과 같으면(YM 등) 중복 표기를 하지 않는다 — 시안도 그렇게 그려져 있다.
      var tagHtml = (tag && tag !== t.name) ? '<span class="team-tag">'+esc(tag)+'</span>' : '';
      return '<div class="team-row" data-rank="'+(i+1)+'" data-team="'+esc(tag)+'"'
        + ' data-team-name="'+esc(t.name)+'" data-alive="'+(t.wiped ? "false" : "true")+'"'
        + ' style="--team-color:'+esc(col)+'">'
        + '<div class="rank">'+(i+1)+'</div>'
        + '<div class="team-chip"></div>'
        + '<div class="team-name"><span class="kr">'+esc(t.name)+'</span>'+tagHtml+'</div>'
        + '<div class="pts">'+(t.points!=null ? t.points : 0)+'</div>'
        + '<div class="kills">'+(d.live ? t.liveKills : t.kills)+'</div>'
        + '</div>';
    }).join("");

    // FLIP — 새 위치를 잰 뒤 이전 위치로 되돌렸다가 놓아준다.
    var rows = box.querySelectorAll(".team-row");
    Array.prototype.forEach.call(rows, function(el){
      var name = el.getAttribute("data-team-name");
      var top = el.offsetTop;
      now[name] = top;
      var was = before[name];
      if(was != null && was !== top){
        el.style.transform = "translateY(" + (was - top) + "px)";
        el.getBoundingClientRect();               // 스타일 강제 반영
        el.classList.add("flip");
        el.style.transform = "";
      }
    });
    prevTop = now;
  }

  function tick(){
    var qs = "?round=" + round + (season ? "&season="+encodeURIComponent(season) : "");
    fetch(GAPI + "/api/gdcup-live-board" + qs, { cache:"no-store" })
      .then(function(r){ return r.json(); })
      .then(render)
      .catch(function(){ /* 방송 중이므로 조용히 넘기고 다음 폴링을 기다린다 */ });
  }
  tick();
  setInterval(tick, every);
})();
</script>
</body>
</html>
