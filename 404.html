<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>페이지 없음 · MRI ACADEMY</title>
<meta name="robots" content="noindex">
<!-- 없는 주소에서 뜨는 페이지. 아무 경로에서나 열리므로 링크 · 자원은 전부 절대 경로(/)로 쓴다.
     Cloudflare Pages 는 이 파일이 없으면 모든 없는 주소에 index.html 을 200 으로 내준다(단일 페이지 앱 취급) — 그래서 둔다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0c;--surface-1:#15151a;--line:#26262b;--gold:#f5c518;--ink:#ededf0;--ink-dim:#a0a0a8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:420px;background:var(--surface-1);border:1px solid var(--line);border-radius:16px;padding:36px 24px;text-align:center}
  .code{font-family:"Archivo Black",Pretendard,system-ui,sans-serif;font-size:40px;color:var(--ink-dim);letter-spacing:.04em}
  h1{font-size:21px;margin:10px 0 6px}
  p{color:var(--ink-dim);font-size:14px;line-height:1.7;margin:0}
  a.home{display:inline-block;margin-top:24px;background:var(--gold);color:#0a0a0c;text-decoration:none;font-weight:800;padding:13px 26px;border-radius:9px;font-size:14px}
  a.home:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="12a35ed9-1619-4484-8ad7-7fb7b1dfe52d"></script>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>여기엔 아무것도 없어요</h1>
  <p>주소가 바뀌었거나 없어진 페이지예요</p>
  <a class="home" href="/">홈으로 가기</a>
</main>
</body>
</html>
