<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>결제 실패 · MRI ACADEMY</title>
<style>
  :root{--bg:#0a0a0c;--card:#141417;--line:#26262b;--gold:#f5c518;--ink:#ededf0;--ink-dim:#a0a0a8;--ink-faint:#6b6b73;--red:#e63946}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 26px;text-align:center}
  .icon{font-size:46px;margin-bottom:10px}
  h1{font-size:21px;margin:6px 0 4px}
  .sub{color:var(--ink-dim);font-size:13.5px;line-height:1.7;margin-bottom:20px}
  .reason{background:rgba(230,57,70,.1);border:1px solid rgba(230,57,70,.35);color:var(--red);border-radius:9px;padding:13px;font-size:13px;line-height:1.6;text-align:left;margin-bottom:6px}
  .btn{display:inline-block;margin-top:22px;background:var(--gold);color:#0a0a0c;text-decoration:none;font-weight:800;padding:13px 26px;border-radius:9px;font-size:14px}
  .alt{display:block;margin-top:14px;color:var(--ink-dim);font-size:12.5px}
  .alt a{color:var(--gold);text-decoration:none}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="12a35ed9-1619-4484-8ad7-7fb7b1dfe52d"></script>
</head>
<body>
<div class="box">
  <div class="icon">⚠️</div>
  <h1>결제가 취소되었어요</h1>
  <p class="sub">결제가 완료되지 않았습니다. 아래 사유를 확인하고 다시 시도해 주세요.</p>
  <div class="reason" id="reason">사유를 불러오는 중…</div>
  <a class="btn" href="apply.html">다시 신청하기</a>
  <span class="alt">문제가 계속되면 <a href="https://open.kakao.com/o/sAUU6OGf">카카오</a> · <a href="https://discord.gg/szFa7teEJs">디스코드</a>로 문의해 주세요.</span>
</div>
<script>
const q = new URLSearchParams(location.search);
const code = q.get("code") || "", message = q.get("message") || "";
document.getElementById("reason").textContent = message
  ? `${message}${code ? " (" + code + ")" : ""}`
  : "결제가 중단되었습니다. 결제 수단·잔액을 확인하거나 다른 수단으로 다시 시도해 주세요.";
</script>
</body>
</html>
