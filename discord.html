<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- mriacademy.gg/discord — MRI 디스코드 서버 초대로 넘긴다(GitHub Pages 동안 · 설계 docs/intake-design.md §6.3).
     Cloudflare Pages 로 옮기면 _redirects 의 /discord 302 가 같은 일을 하고, 이 파일은 허용 목록(site-files.txt)에 없어 올라가지 않는다.
     초대 = 9RjqdSKw(만료 없음 · 횟수 제한 없음 · 오너 확인 10/1). 바꿀 때는 grep -rn 9RjqdSKw 로 전부 같이 고친다.
     넘김 주소라 sitemap.xml 에는 넣지 않는다(넣으면 검색 콘솔이 「리디렉션 페이지」로 잡는다). -->
<meta http-equiv="refresh" content="0; url=https://discord.gg/9RjqdSKw">
<title>디스코드로 이동 · MRI ACADEMY</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#0a0a0c;--surface-1:#15151a;--line:#26262b;--gold:#f5c518;--ink:#f4f4f5;--ink-dim:#c6c6cd;--ink-faint:#9b9ba4}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif}
  .box{width:100%;max-width:400px;background:var(--surface-1);border:1px solid var(--line);border-radius:16px;padding:32px 24px;text-align:center}
  .mark{font-family:'Saira Condensed','Pretendard Variable',sans-serif;font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--ink-faint);margin-bottom:16px}
  h1{font-size:24px;margin:0 0 8px}
  p{color:var(--ink-dim);font-size:15px;line-height:1.7;margin:0}
  .btn{display:inline-block;margin-top:20px;background:var(--gold);color:var(--bg);text-decoration:none;font-weight:800;padding:13px 26px;border-radius:9px;font-size:15px}
</style>
</head>
<body>
<main class="box">
  <div class="mark">MRI ACADEMY</div>
  <h1>디스코드로 가는 중이에요</h1>
  <p>화면이 그대로면 아래 버튼을 눌러 주세요</p>
  <a class="btn" href="https://discord.gg/9RjqdSKw">디스코드 열기</a>
</main>
<script>location.replace("https://discord.gg/9RjqdSKw");</script>
</body>
</html>
