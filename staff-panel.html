<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="panel.webmanifest">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>운영진 패널 · MRI ACADEMY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--bg-el:#15151a;--bg-card:#1a1a20;--ink:#f4f4f5;--ink-dim:#a1a1aa;--ink-faint:#71717a;
  --gold:#f5c518;--gold-soft:rgba(245,197,24,.3);--golddeep:#caa00f;--green:#10b981;--blue:#5ac8fa;--red:#e63946;--line:#27272a;
  --disp:'Archivo Black',sans-serif;--body:'Pretendard Variable',sans-serif;--mono:ui-monospace,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;
  background-image:radial-gradient(circle at 50% 0,rgba(245,197,24,.05),transparent 55%);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 80px}
a{color:var(--gold);text-decoration:none}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.logo{font-family:var(--disp);font-size:17px;display:flex;align-items:center;gap:9px}
.logo .mk{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--gold),var(--golddeep));color:#000;display:flex;align-items:center;justify-content:center;font-size:13px}
.logo small{display:block;font-family:var(--body);font-size:8.5px;font-weight:800;letter-spacing:.2em;color:var(--ink-faint)}
.scope{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid var(--gold-soft);color:var(--gold);background:rgba(245,197,24,.07);letter-spacing:.05em}
.scope.tr{color:var(--blue);border-color:rgba(90,200,250,.3);background:rgba(90,200,250,.07)}
.spacer{margin-left:auto}
.btn{font-family:var(--body);font-weight:700;font-size:13px;padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:var(--bg-card);color:var(--ink);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--gold-soft)}
.btn.gold{background:var(--gold);color:#1a1500;border-color:var(--gold)}
.btn.gold:hover{background:#fde047;transform:translateY(-1px)}
.btn.sm{font-size:11.5px;padding:5px 9px}
.btn.disc{background:#5865F2;color:#fff;border-color:#5865F2}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:rgba(230,57,70,.3)}
h1{font-family:var(--disp);font-size:clamp(20px,4vw,26px);margin:20px 0 4px}
.sub{color:var(--ink-dim);font-size:13px;margin-bottom:18px}
section{margin-top:28px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h h2{font-family:var(--disp);font-size:15px}
.sec-h .tag{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.12em}
.sec-h .line{flex:1;height:1px;background:var(--line)}
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--bg-el);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.kpi .l{font-size:10.5px;color:var(--ink-faint);letter-spacing:.04em}
.kpi .v{font-family:var(--disp);font-size:20px;color:var(--gold);margin-top:5px}
.kpi .v.sm{font-size:15px;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 8px;border-bottom:1px solid rgba(39,39,42,.55);text-align:right;white-space:nowrap}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.tbl .name{font-weight:700;color:var(--ink)}
.tbl .pay{font-weight:800;color:var(--gold)}
.badge{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid}
.badge.ok{color:var(--green);border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.08)}
.badge.sug{color:var(--ink-faint);border-color:var(--line)}
.badge.remain{color:var(--blue);border-color:rgba(90,200,250,.3);background:rgba(90,200,250,.07)}
.scroll{overflow-x:auto}
.stu{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px}
.stu .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stu .nm{font-family:var(--disp);font-size:15px}
.stu .meta{font-size:12px;color:var(--ink-dim);margin-top:4px}
.stu .prog{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.pill{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:7px;background:var(--bg-el);border:1px solid var(--line);color:var(--ink-dim)}
.pill b{color:var(--gold)}
.frm{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
input,select{font-family:var(--body);font-size:13px;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
input:focus,select:focus{outline:none;border-color:var(--gold-soft)}
input.w-s{width:74px}input.w-m{width:110px}input.w-l{width:150px}
label.fl{font-size:11px;color:var(--ink-faint);display:flex;flex-direction:column;gap:3px}
.gate{text-align:center;padding:60px 20px}
.gate .em{font-size:40px;margin-bottom:14px}
.gate h2{font-family:var(--disp);font-size:20px;margin-bottom:8px}
.gate p{color:var(--ink-dim);font-size:14px;margin-bottom:20px}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:8px}
.formrow{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--bg-el);border:1px solid var(--gold-soft);
  color:var(--ink);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(230,57,70,.5);color:#fca5a5}
.muted{color:var(--ink-faint);font-size:12px}
.empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:24px}
.ops{margin-top:28px}
.ops-h{font-size:13px;color:var(--gold);font-weight:800;margin-bottom:12px;letter-spacing:.03em}
.ops-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px}
.oplink{display:flex;align-items:center;gap:9px;padding:13px 14px;background:var(--bg-card);border:1px solid var(--line);border-radius:9px;color:var(--ink);text-decoration:none;font-weight:700;font-size:13.5px;transition:.15s}
.oplink:hover{border-color:var(--gold-soft);background:rgba(245,197,24,.06)}
.oplink .ext{margin-left:auto;color:var(--ink-faint);font-size:12px}
.sched{margin-top:28px}
.sched-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sched-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.srow{background:var(--bg-card);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.srow.off{opacity:.5}
.srow .s1{font-size:13.5px;line-height:1.5}
.srow .s2{font-size:12px;margin-top:4px}
.srow .s3{display:flex;gap:6px;margin-top:9px}
.sched-form{background:var(--bg-el);border:1px dashed var(--line);border-radius:10px;padding:13px}
.sched-form .fh{font-size:12.5px;font-weight:800;color:var(--gold);margin-bottom:9px}
.sched-form .formrow{margin-bottom:9px}
.sched-form .formrow:last-child{margin-bottom:0}
.ck{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-dim);white-space:nowrap}
.ck input{width:auto;accent-color:var(--gold)}
/* ── C1 탭 계층 (표시 전용) — 첫 화면 = 수강생 업무, 나머지는 탭 뒤 기본 숨김 ── */
.ptabs{display:flex;gap:4px;margin:16px 0 2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{font-family:var(--body);font-weight:800;font-size:13.5px;padding:11px 13px;border:0;background:none;color:var(--ink-faint);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:44px;transition:color .15s}
.ptab:hover{color:var(--ink-dim)}
.ptab.on{color:var(--gold);border-bottom-color:var(--gold)}
.ptab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:6px}
.tabpane{display:none}
.tabpane.on{display:block}
/* C2 담당 분리 — 필터 칩 + 담당별 섹션. 미배정은 배정 누락 감지용이라 항상 노출한다 */
.tchips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 2px}
.tchip{font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);
  background:var(--bg-el);color:var(--ink-dim);cursor:pointer;transition:.15s}
.tchip:hover{color:var(--ink)}
.tchip.on{border-color:var(--gold);color:var(--gold)}
.tsec{margin-top:16px}
.tsec .foldn{margin-top:8px}
.tsec .foldn>summary{cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--ink-faint);padding:6px 0}
.tsec .foldn>summary:hover{color:var(--ink-dim)}
/* 동명 경고 가드 — 색에만 의존하지 않는다(도트·볼드 리드 병용) */
.dupwarn{display:none;margin-top:11px;padding:11px 13px;border:1px solid rgba(230,57,70,.45);border-radius:9px;background:rgba(230,57,70,.05);font-size:13px;line-height:1.6}
.dupwarn .lead{color:var(--red);font-weight:800}
.dupwarn .row{margin-top:6px;color:var(--ink-dim)}
.dupwarn .row b{color:var(--ink)}
.dupwarn .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
</style>
</head><body>
<div class="wrap">
  <div style="background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.3);color:#f5c518;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:13px;font-weight:700;text-align:center;line-height:1.5">🔒 읽기전용 모드 (Phase 0.5) — 판수·결제 입력은 디스코드 <b>/수업등록</b>(구글시트)로만. 이 패널 입력은 시트에 반영되지 않습니다.</div>
  <div class="topbar">
    <div class="logo"><span class="mk">M</span><span>MRI ACADEMY<small>STAFF PANEL</small></span></div>
    <span id="scopeBadge" class="scope" style="display:none"></span>
    <div class="spacer"></div>
    <button id="logoutBtn" class="btn ghost sm" style="display:none" onclick="logout()">로그아웃</button>
  </div>

  <div id="gate" class="gate">
    <div class="em">🔒</div>
    <h2>운영진 전용</h2>
    <p>디스코드로 로그인하면 담당 수강생 진행 판수·정산 현황을 볼 수 있어요.</p>
    <button class="btn disc" onclick="login()">디스코드로 로그인</button>
    <div class="hint" id="gateHint"></div>
  </div>

  <div id="app" style="display:none"></div>
</div>
<div id="toast" class="toast"></div>

<script>
const API = "https://mri-academy-production.up.railway.app";
let ME = null, DATA = null, STAFF = [];

// ── 토큰 ──
(function(){ if(location.hash.startsWith("#token=")){ localStorage.setItem("mri_token", location.hash.slice(7)); history.replaceState(null,"",location.pathname); } })();
const token = () => localStorage.getItem("mri_token");
const authH = () => token() ? { Authorization: "Bearer " + token() } : {};
function login(){ location.href = API + "/api/auth/login?return=" + encodeURIComponent(location.href.split("#")[0]); }
function logout(){ localStorage.removeItem("mri_token"); ME=null; location.reload(); }

// ── API 헬퍼 ──
async function api(path, method="GET", body){
  const r = await fetch(API+path, { method, headers:{ "Content-Type":"application/json", ...authH() }, body: body?JSON.stringify(body):undefined });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ("HTTP "+r.status));
  return j;
}
const won = (n)=> Number(n||0).toLocaleString("ko-KR");
const esc = (s)=> String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = ()=> new Date().toISOString().slice(0,10);
function toast(msg, err){ const t=document.getElementById("toast"); t.textContent=msg; t.className="toast on"+(err?" err":""); clearTimeout(t._t); t._t=setTimeout(()=>t.className="toast",2600); }
// 서버 게이트(PANEL_WRITE)에서 파생한다. overview 응답 전·구버전 서버 응답에는 필드가 없으므로 기본은 읽기전용(fail-closed).
let READONLY = true;
async function act(fn){ if(READONLY){ toast("읽기전용 모드 — 판수·결제는 디스코드 /수업등록(시트)로 입력하세요. 이 패널 입력은 반영되지 않습니다.", true); return; } try{ await fn(); await reload(); }catch(e){ toast(e.message||"오류", true); } }

// ── 부팅 ──
(async function boot(){
  if(!token()){ return; }
  try{
    ME = await api("/api/auth/me");
    if(!ME.isStaff){ document.getElementById("gateHint").textContent = "이 계정("+esc(ME.name)+")은 운영진이 아니에요. 클랜장에게 문의하세요."; return; }
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("logoutBtn").style.display="inline-block";
    await reload();
  }catch(e){ localStorage.removeItem("mri_token"); document.getElementById("gateHint").textContent="세션이 만료됐어요. 다시 로그인해주세요."; }
})();

async function reload(){
  DATA = await api("/api/admin/overview");
  READONLY = DATA.panelWrite !== true;
  const sb = document.getElementById("scopeBadge");
  sb.style.display="inline-block";
  const isOwner = DATA.scope === "owner";
  if(isOwner){ sb.className="scope"; sb.textContent="OWNER · 전체"; STAFF = await api("/api/admin/staff").catch(()=>[]); }
  else { sb.className="scope tr"; sb.textContent="TRAINER · "+(DATA.me?DATA.me.name:""); }
  // C1(2026-08-13): 첫 화면 = 수강생 업무만(목록·판수·차감·신규 추가·결제 등록).
  // G드컵·정산·급여·도구는 탭 뒤 기본 숨김 — API·서버 무접촉, 렌더 배치와 호출 시점만 변경.
  // 관여할 수 없는 섹션을 빈 채로 남겨두면 화면만 길어지고 권한이 없는 것처럼 읽힌다 —
  // 트레이너 탭은 「수강생 → 일정 → 바로가기」로 끝난다.
  const app = document.getElementById("app");
  app.innerHTML = panelTabs(isOwner)
    + '<div id="pane-stu" class="tabpane"></div>'
    + '<div id="pane-sched" class="tabpane"><div id="schedwrap"></div></div>'
    + (isOwner
      ? '<div id="pane-gdcup" class="tabpane"><div id="gdcupwrap"></div></div>'
        + '<div id="pane-pay" class="tabpane"></div>'
        + '<div id="pane-salary" class="tabpane"></div>'
        + '<div id="pane-tools" class="tabpane"><div id="toolswrap"></div><div id="statswrap"></div><div id="bpiwrap"></div><div id="opswrap"></div></div>'
      : '<div id="pane-links" class="tabpane"><div id="opswrap"></div></div>');
  if(isOwner){ renderOwnerStudents(); renderOwnerPay(); renderOwnerSalary(); renderOwnerTools(); }
  else renderTrainer();
  document.getElementById("opswrap").innerHTML = opsLinks(isOwner);
  // reload()는 쓰기 후에도 불린다 — 현재 탭은 유지하고, 지연 로드는 다시 밟아 재조회한다.
  for (const k of Object.keys(TAB_LOADED)) delete TAB_LOADED[k];
  if(!isOwner && ["gdcup","pay","salary","tools"].includes(PANEL_TAB)) PANEL_TAB = "stu";
  setTab(PANEL_TAB);
}

// ── C1 탭 — 표시 전용. 일정·G드컵·전적·BPI는 탭 첫 진입 때만 로드
//    (시즌 오프인 G드컵을 부팅마다 조회하던 호출이 사라진다 — 엔드포인트·응답 처리 자체는 불변) ──
let PANEL_TAB = "stu";
const TAB_LOADED = {};
function panelTabs(isOwner){
  const t=(k,l)=>`<button type="button" class="ptab${PANEL_TAB===k?" on":""}" data-tab="${k}" role="tab" aria-selected="${PANEL_TAB===k}" onclick="setTab('${k}')">${l}</button>`;
  return `<nav class="ptabs" role="tablist" aria-label="패널 영역">`
    + t("stu","수강생") + t("sched","일정")
    + (isOwner ? t("gdcup","G드컵")+t("pay","정산")+t("salary","급여")+t("tools","도구") : t("links","바로가기"))
    + `</nav>`;
}
function setTab(k){
  PANEL_TAB = k;
  document.querySelectorAll(".ptab").forEach(b=>{ const on=b.dataset.tab===k; b.classList.toggle("on",on); b.setAttribute("aria-selected",String(on)); });
  document.querySelectorAll(".tabpane").forEach(p=>p.classList.toggle("on", p.id==="pane-"+k));
  if(!TAB_LOADED[k]){
    TAB_LOADED[k] = true;
    if(k==="sched") loadSchedule();
    if(k==="gdcup") loadGdcup();
    if(k==="tools"){ loadStats(); loadDist(); }
  }
}


// ── 🏆 G드컵 신청 현황 (staff) · 계좌·CSV는 owner 전용 ──
// 계좌는 서버가 owner에게만 내려준다(/api/gdcup-payouts). 여기서 감추는 건 표시상 편의일 뿐,
// 실제 차단은 서버가 한다.
let GD_SEASON = 3, GD_TEAMS = [], GD_PAY = null;
async function loadGdcup(){
  const w = document.getElementById("gdcupwrap"); if(!w) return;
  try{
    const r = await api("/api/gdcup-apps?season="+GD_SEASON);
    GD_TEAMS = r.teams || [];
    renderGdcup(r.unverified || 0);
  }catch(e){
    w.innerHTML = `<section class="ops"><h2 class="ops-h">🏆 G드컵 신청 현황</h2><div class="empty">불러오지 못했어요 (${esc(e.message)}).</div></section>`;
  }
}
function gdMemberLine(m){
  const v = m.verified === true ? '<span style="color:#4ade80">✅</span>'
          : m.verified === false ? '<span style="color:#fbbf24" title="등록계 미등록">⚠️</span>'
          : '<span style="color:var(--ink-faint)">—</span>';
  return `${v} ${esc(m.ign||"-")} <span style="color:var(--ink-faint)">(${esc(m.tier||"?")}${m.dmg?" · "+esc(m.dmg)+"딜":""})</span>`;
}
function renderGdcup(unverified){
  const w = document.getElementById("gdcupwrap");
  const isOwner = DATA.scope === "owner";
  if(!GD_TEAMS.length){
    w.innerHTML = `<section class="ops"><h2 class="ops-h">🏆 G드컵 신청 현황</h2><div class="empty">아직 신청 팀이 없어요.</div></section>`;
    return;
  }
  const rows = GD_TEAMS.map(t2 => {
    const when = t2.created_at ? String(t2.created_at).slice(0,16).replace("T"," ") : "";
    const pay = (isOwner && GD_PAY) ? (GD_PAY[t2.id]||[]) : null;
    const payHtml = pay ? `<div style="margin-top:8px;padding:9px 10px;background:var(--bg-el);border-radius:8px;font-size:12px;line-height:1.8">
      ${pay.length ? pay.map(x=>`💳 ${esc(x.real_name||"-")} · ${esc(x.bank||"-")} ${esc(x.account_no||"-")} (${esc(x.holder||"-")})`).join("<br>")
                   : '<span style="color:var(--ink-faint)">계좌 미입력</span>'}
    </div>` : "";
    return `<div class="srow" style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <b>${esc(t2.team_name)}</b>
        <span style="color:var(--ink-faint);font-size:12px">BPI ${t2.bpi} · ×${t2.weight} · ${esc(when)}</span>
      </div>
      <div style="margin-top:7px;font-size:13px;line-height:1.9">${(t2.members||[]).map(gdMemberLine).join("<br>")}</div>
      <div style="margin-top:6px;color:var(--ink-faint);font-size:12px">연락처 ${esc(t2.contact||"-")}${t2.leader_discord?" · 팀장 "+esc(t2.leader_discord):""}</div>
      ${payHtml}
    </div>`;
  }).join("");
  w.innerHTML = `<section class="ops">
    <h2 class="ops-h">🏆 G드컵 신청 현황 <span style="font-weight:400;color:var(--ink-faint);font-size:13px">시즌 ${GD_SEASON} · ${GD_TEAMS.length}팀</span></h2>
    ${unverified ? `<div class="empty" style="margin-bottom:10px">⚠️ 등록계 미등록 멤버 <b>${unverified}명</b> — <code>/등록계</code> 안내 필요 (상시 접수)</div>` : ""}
    ${isOwner ? `<div style="display:flex;gap:8px;margin-bottom:11px;flex-wrap:wrap">
      <button class="btn" onclick="toggleGdPayouts()">${GD_PAY ? "계좌 숨기기" : "💳 계좌 보기"}</button>
      <button class="btn" onclick="downloadGdCsv()">⬇️ 정산 CSV</button>
    </div>` : ""}
    ${rows}
  </section>`;
}
async function toggleGdPayouts(){
  if(GD_PAY){ GD_PAY = null; renderGdcup(0); return; }
  try{
    const r = await api("/api/gdcup-payouts?season="+GD_SEASON);
    GD_PAY = {};
    (r.payouts||[]).forEach(x => { (GD_PAY[x.app_id] = GD_PAY[x.app_id] || []).push(x); });
    renderGdcup(0);
  }catch(e){ alert("계좌 조회 실패: "+e.message+"\n(오너 계정만 조회할 수 있어요)"); }
}
async function downloadGdCsv(){
  // 순위 입력 → appId:순위 매핑. 비우면 전체 팀을 순위 없이 내보낸다.
  const hint = GD_TEAMS.map(t2=>`${t2.id}=${t2.team_name}`).join("\n");
  const ranks = prompt("순위를 입력하세요 (형식: 팀ID:순위, 쉼표 구분)\n비우면 전체 팀\n\n"+hint, "");
  if(ranks === null) return;
  const prizes = ranks.trim() ? (prompt("순위별 상금 (형식: 순위:금액, 쉼표 구분)\n예: 1:400000,2:200000\n비우면 금액 없이", "") || "") : "";
  const qs = "?season="+GD_SEASON + (ranks.trim()?"&ranks="+encodeURIComponent(ranks.trim()):"") + (prizes.trim()?"&prizes="+encodeURIComponent(prizes.trim()):"");
  try{
    const res = await fetch(API + "/api/gdcup-payouts.csv" + qs, { headers: authH() });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `gdcup-s${GD_SEASON}-payouts.csv`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }catch(e){ alert("CSV 내려받기 실패: "+e.message+"\n(오너 계정만 가능해요)"); }
}

// ── 📊 전적 스냅샷 (Phase T1, owner 전용) — server 라우트는 읽기전용 게이트 밖이라 직접 호출 ──

    const inv=(r.needsInvestigation||[]).length ? (r.needsInvestigation||[]).map(i=>`<div class="srow"><b>${esc(i.student)}</b> · <span class="muted">${esc(i.reason)}</span></div>`).join("") : "";
    body=`<div class="pill">마스터+ 달성률 <b>${r.masterRate}%</b> (${r.masterCount}/${rated})</div>${r.unlinked?` <span class="muted">· 미연결 ${r.unlinked}명${esc(urTxt)}</span>`:""}
      <div style="margin-top:11px;font-size:12.5px;font-weight:700">승급 후보 (미등록 마스터+)</div>${cand}`
      +(nick?`<div style="margin-top:11px;font-size:12.5px;font-weight:700">🔄 닉변 감지 (이력 기록됨)</div>${nick}`:"")

  w.innerHTML=`<section class="ops"><h2 class="ops-h">📊 전적 스냅샷 (PUBG)</h2>
    <button class="btn gold sm" onclick="runStats()"${r&&r.running?" disabled":""}>전수 스냅샷 실행</button>
    <span class="muted" style="margin-left:8px">계정당 ~7초 · 완료 시 오너 DM</span>
    <div style="margin-top:12px">${body}</div></section>`;
}

// ── 📈 BPI 분포 (경쟁전 임계값 재보정용) ──────────────────────────
// PUBG 10 RPM 때문에 오너가 닉을 하나씩 조회할 수 없다. 서버가 닉당 7초 페이싱으로
// 순회한 결과(/api/pubg-dist·pubg-dist-detail)를 표로 보여주기만 한다 — 여기서 PUBG를
// 직접 부르지 않는다. 판정 로직과 무관한 읽기 전용 계측 화면.
let DIST=null, DISTD=null, _dti=null;
const nz = (v)=> (v==null||v==="") ? "—" : v;
function renderDist(){
  const w=document.getElementById("bpiwrap"); if(!w) return;
  const rk=DIST&&DIST.ranked, rows=(DISTD&&DISTD.rows)||[];
  let head;
  if(!DIST || DIST.status==="init"){ head=`<div class="muted">아직 수집하지 않았어요.</div>`; }
  else if(DIST.status==="disabled"){ head=`<div class="muted">PUBG 키 또는 DB 연동이 없어 비활성 상태예요.</div>`; }
  else if(DIST.status==="error"){ head=`<div class="muted">수집 중 오류가 났어요. 다시 시도해주세요.</div>`; }
  else {
    const s=rk&&rk.stats;
    head = `<div class="pill">경쟁전 표본 <b>${nz(rk&&rk.counted)}</b></div> `
      + `<span class="muted">대상 ${nz(rk&&rk.targets)} · 조회실패 ${nz(rk&&rk.notFound)} · 판수부족 ${nz(rk&&rk.thin)} · 기록없음 ${nz(rk&&rk.missing)} · 기준 ${nz(rk&&rk.minRounds)}판</span>`
      // 대상 0이면 수집기가 아니라 소스가 비어 있다는 뜻 — 오해 방지용 안내.
      + (rk && rk.targets===0 ? `<div style="margin-top:7px;color:#fbbf24;font-size:12.5px">조회 대상이 0명입니다 —
            ${DIST.source==="gdcup" ? "이번 시즌 신청 팀이 없거나 멤버 닉이 비어 있어요." : "등록계(clan_registry·pubg_nicks)에 등록된 닉이 없어요."}
            수집기 문제가 아닙니다.</div>` : "")
      + (s ? `<div style="margin-top:9px;font-size:12.5px">경쟁전 평딜 분위수 —
            p10 <b>${s.p10}</b> · p25 <b>${s.p25}</b> · p50 <b>${s.p50}</b> · p75 <b>${s.p75}</b> · p90 <b>${s.p90}</b>
            <span class="muted">(min ${s.min} · 평균 ${s.mean} · max ${s.max})</span></div>` : "")
      + (rk&&rk.ratio ? `<div style="margin-top:5px;font-size:12.5px">경쟁전÷일겜 비율 — 중앙값 <b>${rk.ratio.median}</b>
            <span class="muted">(평균 ${rk.ratio.mean} · n=${rk.ratio.n})</span></div>` : "")
      + `<div class="muted" style="margin-top:5px">수집 ${DIST.updatedAt ? new Date(DIST.updatedAt).toLocaleString("ko-KR") : "—"}</div>`;
  }
  // 신고값(claimed*)은 G드컵 신청자 소스에만 있다 — 있을 때만 열을 붙인다.
  const hasClaim = rows.some(r=>r.claimedTier!=null||r.claimedDmg!=null);
  const th = (t)=>`<th style="padding:6px 8px">${t}</th>`;
  const body = rows.length ? `<div style="overflow-x:auto;margin-top:12px">
      <table style="width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap">
      <thead><tr style="color:var(--ink-faint);text-align:left">
        ${th("닉")}${th("플랫폼")}${hasClaim?th("팀")+th("신고tier")+th("신고딜"):""}
        ${th("경쟁전딜")}${th("경쟁전판수")}${th("bestRP")}${th("티어")}
        ${th("일겜딜")}${th("비율")}${th("서버판정")}
      </tr></thead><tbody>${rows.map(r=>{
        const thin = r.rankedRounds!=null && r.rankedRounds < (rk&&rk.minRounds||10);
        return `<tr style="border-top:1px solid var(--line)">
          <td style="padding:6px 8px">${esc(r.nick)}${thin?' <span title="경쟁전 표본 부족" style="color:#fbbf24">⚠</span>':''}</td>
          <td style="padding:6px 8px" class="muted">${esc(r.platform)}</td>
          ${hasClaim?`<td style="padding:6px 8px" class="muted">${esc(nz(r.team))}</td>
          <td style="padding:6px 8px">${esc(nz(r.claimedTier))}</td>
          <td style="padding:6px 8px">${nz(r.claimedDmg)}</td>`:""}
          <td style="padding:6px 8px"><b>${nz(r.rankedAvgDamage)}</b></td>
          <td style="padding:6px 8px${thin?';color:#fbbf24;font-weight:700':''}">${nz(r.rankedRounds)}</td>
          <td style="padding:6px 8px">${nz(r.bestRankPoint)}</td>
          <td style="padding:6px 8px" class="muted">${esc(nz(r.rankedTier))}</td>
          <td style="padding:6px 8px">${nz(r.sampleAvgDamage)}</td>
          <td style="padding:6px 8px">${r.ratio!=null?Math.round(r.ratio*100)+"%":"—"}</td>
          <td style="padding:6px 8px${r.tierMismatch?';color:#fbbf24;font-weight:700':''}">${esc(nz(r.currentTier))}${r.tierMismatch?' <span title="신고 tier와 서버 판정이 다름 — 확정 시 mismatch로 걸린다">≠</span>':''}</td>
        </tr>`;}).join("")}</tbody></table></div>` : "";
  const src = (DIST&&DIST.source) || "registry";
  const tab = (key,label)=>`<button class="btn sm${src===key?" gold":""}" onclick="runDist('${key}')">${label}</button>`;
  w.innerHTML=`<section class="ops"><h2 class="ops-h">📈 BPI 분포 (경쟁전)</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${tab("registry","클랜원 등록계")}${tab("gdcup","G드컵 신청자")}
      <span class="muted">클랜원 닉당 ~7초 · 신청자는 양대 플랫폼 조회라 ~20초</span>
    </div>
    <div style="margin-top:12px">${head}</div>${body}</section>`;
}
async function loadDist(){
  try{ DIST=await api("/api/pubg-dist"); }catch(e){ DIST=null; }
  try{ DISTD=await api("/api/pubg-dist-detail"); }catch(e){ DISTD=null; }
  renderDist();
}
async function runDist(source){
  const s = (source==="gdcup"||source==="registry") ? source : "registry";
  try{
    await api("/api/pubg-dist/refresh?source="+s,"POST");
    toast(s==="gdcup" ? "G드컵 신청자 분포 수집 시작 — 닉당 20초라 몇 분 걸려요"
                      : "클랜원 분포 수집 시작 — 닉당 7초라 몇 분 걸려요");
  }
  catch(e){ toast(e.message==="already_running"?"이미 수집 중":(e.message||"오류"), true); }
  clearInterval(_dti);
  // 수집 완료 신호가 따로 없어 updatedAt 변화로 감지한다.
  const before = DIST && DIST.updatedAt;
  _dti=setInterval(async()=>{
    try{
      const d=await api("/api/pubg-dist");
      if(d && d.updatedAt && d.updatedAt!==before){
        clearInterval(_dti); await loadDist(); toast("분포 수집 완료");
      }
    }catch(e){}
  }, 10000);
}

// ── 🗓️ 일정 관리 (Phase S1) — schedule는 서버에서 읽기전용 게이트 예외라 act() 안 거치고 직접 쓴다 ──
const SCHED = { week:0, kind:"lesson", editing:null, _byId:{} };
// 레슨 형식 3분류(2026-08-13 오너 확정) — 구 라벨 매핑: 참여형·그룹 → 그룹레슨 / 1:1·개인 → 개인레슨.
// schedule_events 0행 실측이라 과거 라벨 고아는 없다. 봇기록(시트) 이관 시 같은 매핑을 적용한다.
const SCHED_FMT = { lesson:["개인레슨","그룹레슨","관전형","자율연습","상담"], direct:["초급반","중급반","심화반","개인강의","그룹강의"] };
const DOW = ["일","월","화","수","목","금","토"];
const dPlus = (d,n)=>{ const x=new Date(d+"T00:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const schedDow = (d)=> DOW[new Date(d+"T00:00:00Z").getUTCDay()];

async function loadSchedule(){
  const wrap = document.getElementById("schedwrap"); if(!wrap) return;
  const isOwner = DATA.scope==="owner";
  let data;
  try{ data = await api(`/api/admin/schedule?week=${SCHED.week}&kind=${SCHED.kind}`); }
  catch(e){ wrap.innerHTML = `<section class="sched"><h2 class="ops-h">🗓️ 일정 관리</h2><div class="empty">일정을 불러오지 못했어요 (${esc(e.message)}). schedule_events 테이블 생성 여부를 확인하세요.</div></section>`; return; }
  const ev = data.events||[]; SCHED._byId={}; ev.forEach(e=>SCHED._byId[e.id]=e);
  const wt=(n,l)=>`<button class="btn sm ${SCHED.week===n?"gold":""}" onclick="setSchedWeek(${n})">${l}</button>`;
  const kt=(k,l)=>`<button class="btn sm ${SCHED.kind===k?"gold":""}" onclick="setSchedKind('${k}')">${l}</button>`;
  const list = ev.length ? ev.map(schedRow).join("") : `<div class="empty">이 주 ${SCHED.kind==="lesson"?"레슨":"직강"} 일정이 없어요.</div>`;
  const wk = data.week ? `${esc(data.week.start)} ~ ${esc(dPlus(data.week.end,-1))}` : "";
  wrap.innerHTML = `
  <section class="sched">
    <h2 class="ops-h">🗓️ 일정 관리 <span class="muted" style="font-weight:500;font-size:11px">${wk}</span></h2>
    <div class="sched-tabs">
      ${wt(0,"이번주")}${wt(1,"다음주")}${wt(2,"다다음주")}<span style="width:6px"></span>${kt("lesson","레슨")}${isOwner?kt("direct","직강"):""}
      <button class="btn sm" style="margin-left:auto" onclick="copyWeek(false)">📋 이번 주 → 다음 주 복사</button>
    </div>
    <div class="sched-list">${list}</div>
    ${schedForm(isOwner)}
  </section>`;
}

function schedRow(e){
  const t = (e.start_time?e.start_time.slice(0,5):"") + (e.end_time?"~"+e.end_time.slice(0,5):"");
  const cap = e.capacity!=null ? ` · 정원 ${e.capacity}` : "";
  const rec = e.is_recruiting ? ` <span class="badge ok">모집중</span>` : "";
  const pub = e.is_public===false ? ` <span class="badge sug">비공개</span>` : "";
  const off = e.status==="cancelled";

function setSchedWeek(n){ SCHED.week=n; SCHED.editing=null; loadSchedule(); }
function setSchedKind(k){ SCHED.kind=k; SCHED.editing=null; loadSchedule(); }
function schedEdit(id){ SCHED.editing=SCHED._byId[id]; loadSchedule().then(()=>{ const f=document.querySelector(".sched-form"); if(f) f.scrollIntoView({behavior:"smooth",block:"center"}); }); }
function schedCancelEdit(){ SCHED.editing=null; loadSchedule(); }

async function schedSave(){
  const ed = SCHED.editing;
  const g = (id)=>document.getElementById(id);
  const body = {
    kind: g("ss_kind").value, format: g("ss_format").value, event_date: g("ss_date").value,
    start_time: g("ss_start").value||null, end_time: g("ss_end").value||null,
    title: g("ss_title").value, participants: g("ss_part").value,
    capacity: g("ss_cap").value, memo: g("ss_memo").value,
    is_public: g("ss_public").checked, is_recruiting: g("ss_recruit").checked,
  };
  const tsel = g("ss_trainer"); if(tsel) body.trainer_id = tsel.value||null;
  if(!body.event_date) return toast("날짜를 선택하세요", true);
  try{
    if(ed){ await api("/api/admin/schedule/"+ed.id, "PATCH", body); toast("일정 수정됨"); SCHED.editing=null; }
    else { const r = await api("/api/admin/schedule","POST",body); toast("일정 추가됨"); if(r.warning) setTimeout(()=>toast(r.warning,true), 300); }
    await loadSchedule();
  }catch(e){ toast(e.message||"오류", true); }
}
async function schedCancel(id){
  if(!confirm("이 일정을 취소할까요? (기록은 남고 공개에서 숨겨집니다)")) return;
  try{ await api("/api/admin/schedule/"+id, "PATCH", {status:"cancelled"}); toast("일정 취소됨"); await loadSchedule(); }
  catch(e){ toast(e.message||"오류", true); }
}
async function copyWeek(force){
  const r = await fetch(API+"/api/admin/schedule/copy-week", { method:"POST", headers:{"Content-Type":"application/json", ...authH()}, body:JSON.stringify({week:SCHED.week, confirm:!!force}) });
  const j = await r.json().catch(()=>({}));
  if(r.status===409 && j.error==="target_not_empty"){ if(confirm(`다음 주에 이미 ${j.count}건 있어요. 그래도 추가로 복사할까요?`)) return copyWeek(true); return; }
  if(!r.ok){ return toast(j.error||"복사 오류", true); }
  toast(`${j.inserted}건 복사됨 → 다음 주`); SCHED.week=Math.min(2,SCHED.week+1); SCHED.editing=null; await loadSchedule();
}

// 내 등록분 칩 — 병행수강이면 학생이 두 트레이너 화면에 뜨되 각자 자기 등록만 본다.
// 중복 신청 사고(정희준: 준구가 이미 등록된 판수를 다시 신청할 뻔함)를 화면에서 막는 지점이다.
// units_total은 numeric(6,2)라 "8.00"으로 내려온다. Number를 거쳐 8 / 8.5로 보여준다.
const unitTxt = v => v==null ? "?" : String(Number(v));
function enrChips(s){
  const E = s.enrollments || [], C = s.courses || [];
  if(!E.length && !C.length) return `<span class="pill">등록 기록 없음</span>`;
  const fmt = (status, started_on) => [
    started_on ? ` <span class="muted">${String(started_on).slice(5).replace("-","/")}</span>` : "",
    status && status!=="active" ? ` · ${esc(status)}` : "",
  ];
  const lesson = E.map(e=>{
    const [on, st] = fmt(e.status, e.started_on);
    return `<span class="pill">내 등록 <b>${e.games_total}</b>판${on}${st}</span>`;
  });
  // 강의는 회차 단위이고 지급이 없다 — 판수 칩과 라벨을 갈라 놓는다.
  const lecture = C.map(c=>{
    const [on, st] = fmt(c.status, c.started_on);
    const lv = c.level ? `${esc(c.level)} ` : "";
    return `<span class="pill">강의 ${lv}<b>${unitTxt(c.units_total)}</b>회${on}${st}</span>`;
  });
  return [...lesson, ...lecture].join("");
}

function stuCard(s){
  // mine=false → 다른 트레이너 담당 학생인데 내 등록분이 있는 경우(병행수강).
  // 금액·전체 진행은 남의 담당분까지 합산된 값이라 서버가 가려서 내려준다.
  const mine = s.mine !== false;
  const bonusPill = s.bonus_new > 0 ? `<span class="pill">재결제분 <b>${s.bonus_new}</b>판(+5%p)</span>` : "";
  const rate = `<span class="badge ok">지급율 ${Math.round((s.base_rate||0)*100)}%</span>`;
  const paraBadge = s.parallel ? `<span class="badge">병행수강</span>` : "";
  // 강의는 판수·지급 축이 아니라서 '남은 N판'과 나란히 두면 오독된다. 뱃지로 축을 먼저 알린다.
  const lecBadge = (s.courses||[]).length ? `<span class="badge">강의</span>` : "";
  return `<div class="stu">
    <div class="top"><span class="nm">${esc(s.name)}</span>${s.discord_nick?`<span class="muted">${esc(s.discord_nick)}</span>`:""}
      ${paraBadge}${lecBadge}${mine?`<span class="badge remain">남은 ${s.remain}판</span>`:`<span class="badge">타 담당 · 내 등록분만</span>`}</div>
    <div class="prog">
      ${enrChips(s)}
      ${mine?`<span class="pill">진행 <b>${s.played}</b>판</span>
      <span class="pill">결제 ${s.paid_games}판</span>
      <span class="pill">신규 <b>${s.new_played}</b>판(7/20↑)</span>
      ${bonusPill}
      <span class="pill">지급예정 <b>${won(s.payable)}</b>원</span>
      ${rate}`:``}
    </div>
    ${READONLY ? "" : `<div class="frm">
      <label class="fl">날짜<input type="date" class="w-m" id="sd_${s.student_id}" value="${today()}"></label>
      <label class="fl">진행판수<input type="number" min="1" class="w-s" id="sg_${s.student_id}" placeholder="예:3"></label>
      <label class="fl" style="flex:1;min-width:120px">메모(선택)<input type="text" id="sm_${s.student_id}" placeholder="코칭 포인트"></label>
      <button class="btn gold sm" onclick="addSession(${s.student_id})">＋ 판수 기록</button>
    </div>`}
  </div>`;
}

  const memo = document.getElementById("sm_"+id).value;
  act(async ()=>{ await api("/api/admin/sessions","POST",{student_id:id,games,played_at,memo}); toast("판수 "+games+"판 기록됨"); });
}

        <label class="fl">디코ID<input id="st_did" class="w-l" placeholder="숫자 ID"></label>
        <label class="fl">기본급<input type="number" id="st_base" class="w-m" placeholder="0"></label>
        <button class="btn gold sm" onclick="addStaff()">운영진 추가</button>
      </div>
      <div class="hint">디코ID는 로그인 매핑용. 트레이너는 본인 담당 수강생만, 사장은 전체가 보입니다.</div>
      </div>
    </section>

    <section>
      <div class="sec-h"><h2>내보내기</h2><span class="line"></span></div>
      <button class="btn" onclick="exportCsv()">⬇ 정산 CSV 내보내기 (엑셀)</button>
      <span class="hint">시트처럼 언제든 스냅샷을 받을 수 있어요.</span>
    </section>
  `;
}

// ── C2: 담당별 섹션 (오너) ───────────────────────────────────────────
// 학생이 아니라 **등록**이 담당을 정한다. 병행수강 학생은 각 담당 섹션에 자기 등록분으로 함께 뜬다.
// (준구가 정희준의 이미 등록된 판수를 중복 신청할 뻔한 사고 — 화면이 담당을 안 나눠서 생겼다.)
let TR_FILTER = "all";
const inSec = (s,tid)=> tid===null ? !(s.trainer_ids||[]).length : (s.trainer_ids||[]).includes(tid);

function secList(S){
  const staff = STAFF||[];
  const trs = staff.filter(x=>x.role==="trainer");
  const secs = trs.map(t=>({key:String(t.id), tid:t.id, name:t.name}));
  // 담당이 트레이너가 아닌 경우에도 섹션을 만든다 — 강의(§17 courses)는 오너 직강이라
  // role='owner'가 담당이 된다. role로만 섹션을 만들면 강의 학생이 어느 섹션에도 안 뜬다.
  // 실제 담당으로 등장할 때만 만들므로, 강의가 없으면 오너 섹션도 생기지 않는다.
  const seen = new Set(trs.map(t=>t.id));
  for(const s of S) for(const tid of (s.trainer_ids||[])){
    if(tid==null || seen.has(tid)) continue;
    seen.add(tid);
    secs.push({key:String(tid), tid, name:(staff.find(x=>x.id===tid)||{}).name || `담당 #${tid}`});
  }
  return [...secs, {key:"none", tid:null, name:"미배정"}];
}
function trainerChips(S){
  const secs = secList(S);
  const chip = (key,label,n)=>`<button type="button" class="tchip${TR_FILTER===key?" on":""}" onclick="setTrFilter('${key}')">${esc(label)}${n===null?"":` <b>${n}</b>`}</button>`;
  return `<div class="tchips" role="group" aria-label="담당 필터">`
    + chip("all","전체",S.length)
    + secs.map(x=>chip(x.key,x.name,S.filter(s=>inSec(s,x.tid)).length)).join("")
    + `</div>`;
}
function setTrFilter(k){
  TR_FILTER = k;
  const S = DATA.students||[];
  document.querySelector("#pane-stu .tchips").outerHTML = trainerChips(S);
  document.getElementById("stusecs").innerHTML = trainerSections(S);
}
function trainerSections(S){
  const secs = secList(S).filter(x=> TR_FILTER==="all" || TR_FILTER===x.key);
  if(!S.length) return `<div class="card"><div class="empty">수강생을 추가하세요</div></div>`;
  return secs.map(x=>{
    const mem = S.filter(s=>inSec(s,x.tid));
    const act = mem.filter(s=>s.status==="active");
    const rest = mem.filter(s=>s.status!=="active");
    // 미배정은 0명이어도 섹션을 남긴다 — 배정 누락은 "안 보이는 것"이 아니라 "0으로 보이는 것"이어야 한다.
    if(!mem.length && x.tid!==null) return "";
    return `<section class="tsec">
      <div class="sec-h"><h2>${esc(x.name)}</h2><span class="tag">${act.length}명${rest.length?` · 종료·중지 ${rest.length}`:""}</span><span class="line"></span></div>
      <div class="card scroll">${stuTable(act, x.tid, x.tid===null?"이 섹션이 비어 있으면 정상입니다 — 담당 미배정자가 없습니다":"활성 수강생 없음")}</div>
      ${rest.length?`<details class="foldn"><summary>종료·중지 ${rest.length}명 보기</summary>
        <div class="card scroll" style="margin-top:8px">${stuTable(rest, x.tid, "")}</div></details>`:""}
    </section>`;
  }).join("") || `<div class="card"><div class="empty">해당 담당의 수강생이 없습니다</div></div>`;
}
function stuTable(rows, tid, emptyMsg){
  return `<table class="tbl"><thead><tr>
      <th>수강생</th><th>담당</th><th>등록·강의</th><th>결제</th><th>진행</th><th>남은</th><th>지급율</th><th>지급예정</th><th>기록/확정</th>
    </tr></thead><tbody>
    ${ rows.length ? rows.map(s=>stuRow(s,tid)).join("") : `<tr><td colspan="9" class="empty">${esc(emptyMsg)}</td></tr>` }
    </tbody></table>`;
}
// 섹션 담당(tid)이 주어지면 그 담당의 등록분만 칩으로 보여준다 — 병행수강이 섹션마다 다르게 표시된다.
function ownerEnrCell(s, tid){
  const E = (s.enrollments||[]).filter(e=> tid===null ? true : e.trainer_id===tid);
  const C = (s.courses||[]).filter(c=> tid===null ? true : c.trainer_id===tid);
  if(!E.length && !C.length) return `<span class="muted">—</span>`;
  // 강의는 판이 아니라 회차다. 라벨을 붙여 판수 칩과 절대 섞이지 않게 한다.
  return [...E.map(e=>`<span class="pill">${e.games_total}판</span>`),
          ...C.map(c=>`<span class="pill">강의 <b>${unitTxt(c.units_total)}</b>회</span>`)].join(" ");
}

function stuRow(s, tid){
  const rate = s.rate_confirmed ? `<span class="badge ok">${Math.round(s.applied_rate*100)}%</span>` : `<span class="badge sug">제안 ${Math.round(s.applied_rate*100)}%</span>`;
  const tName = (STAFF.find(x=>x.id===s.trainer_id)||{}).name || "—";
  const para = s.parallel ? ` <span class="badge">병행</span>` : "";
  // 병행수강 학생은 담당 섹션마다 한 번씩 나오므로 id가 아니라 class+data-sid로 잡는다
  // (id를 쓰면 중복 id가 되고 getElementById가 첫 섹션만 집는다).
  return `<tr class="srow" data-sid="${s.student_id}">
    <td class="name">${esc(s.name)}${para}</td><td class="muted">${esc(tName)}</td>
    <td>${ownerEnrCell(s, tid===undefined?null:tid)}</td>
    <td class="muted">${won(s.paid_amount)}<span style="font-size:10px">/${s.paid_games}판</span></td>
    <td>${s.played}판</td><td class="muted">${s.remain}</td><td>${rate}</td>
    <td class="pay">${won(s.payable)}</td>
    <td style="white-space:nowrap">
      <button class="btn sm" onclick="sessFor(${s.student_id},'${esc(s.name)}')">판수</button>
      <button class="btn sm gold" onclick="confirmRate(${s.student_id},'${esc(s.name)}',${s.suggested_rate})">지급율</button>
    </td></tr>`;
}

function trainerOpts(){ return `<option value="">미배정</option>`+STAFF.filter(s=>s.role==="trainer").map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(""); }
function studentOpts(){ return (DATA.students||[]).map(s=>`<option value="${s.student_id}">${esc(s.name)}</option>`).join(""); }

// ── 동명 확인 — 봇 `/수강생등록`(server.js)의 동명 확인과 판정·선택지를 일치시킨다.
// 두 입력 경로가 다르게 굴면 그 차이 자체가 다음 사고다(메인 트랙 지시 2026-08-13).
// 봇과 맞춘 지점 4가지:
//   ① 대상은 status='active' 행만  ② 차단하지 않고 경고 후 명시적 확인
//   ③ 선택지 [그래도 등록]/[취소]  ④ 목록 표기 `#id(담당)`
// 문안은 봇의 내용을 그대로 옮기되 어미만 이 화면의 존댓말에 맞췄다.
// 병행수강 2행이 정상인 케이스가 실재한다(정희준·장익교 — 8/13 오너 판정) — 그래서 막지 않는다.
// 클라이언트 검사다: overview에 이미 실려 온 목록과 대조하므로 추가 API 호출이 없다.
// 서버측 강제(별칭·resolveStudentId 연계)는 admin-panel.js 소관 — 봇 v2 재배선에서 처리.
let DUP_OK = false;
function dupWarnHtml(list){
  const ids = list.map(s=>{
    const tName = (STAFF.find(x=>x.id===s.trainer_id)||{}).name || "담당없음";
    return `#${s.student_id}(${esc(tName)})`;
  }).join(", ");
  return `<span class="lead">⚠ '${esc(list[0].name)}' 이름의 활성 수강생이 이미 ${list.length}건 있습니다.</span>
    <div class="row">· ${ids}</div>
    <div class="row">병행수강처럼 <b>2행이 정상인 경우</b>도 있어서 막지는 않습니다.
      같은 사람이면 [취소] 후 기존 행을 그대로 쓰시고, 다른 사람이거나 병행수강이면 [그래도 등록].</div>
    <div class="acts">
      <button type="button" class="btn sm danger" onclick="DUP_OK=true;addStudent()">그래도 등록</button>
      <button type="button" class="btn sm" onclick="dupCancel(${list[0].student_id})">취소</button>
    </div>`;
}
// 봇의 "취소했어. 기존 명부 행을 그대로 쓰면 돼"에 대응 — 화면에선 그 행을 짚어준다.
function dupCancel(id){
  DUP_OK = false;
  const w = document.getElementById("ns_warn");
  if(w){ w.style.display="none"; w.innerHTML=""; }
  showDupRow(id);
}
function showDupRow(id){
  setTab("stu");
  // 담당 필터가 걸려 있으면 대상 행이 화면에 없을 수 있다 — 전체로 풀고 다시 그린다.
  if(typeof TR_FILTER!=="undefined" && TR_FILTER!=="all" && document.getElementById("stusecs")) setTrFilter("all");
  const rows = document.querySelectorAll('.srow[data-sid="'+id+'"]');
  if(!rows.length) return;
  rows[0].scrollIntoView({behavior:"smooth",block:"center"});
  rows.forEach(tr=>{                                  // 병행수강이면 두 섹션 모두 표시한다
    tr.style.transition="background .3s"; tr.style.background="rgba(245,197,24,.12)";
    setTimeout(()=>{ tr.style.background=""; }, 1600);
  });
}
function addStudent(){
  const name=document.getElementById("ns_name").value.trim(); if(!name) return toast("이름을 입력하세요",true);
  const warn=document.getElementById("ns_warn");
  // 봇과 동일 판정 — 활성 행만 본다(종료·환불 행은 동명 경고 대상이 아니다)
  const dups=(DATA.students||[]).filter(s=>String(s.name||"").trim()===name && s.status==="active");
  if(dups.length && !DUP_OK){ warn.style.display="block"; warn.innerHTML=dupWarnHtml(dups); return; }
  DUP_OK=false; if(warn){ warn.style.display="none"; warn.innerHTML=""; }
  act(async ()=>{ await api("/api/admin/students","POST",{name,discord_nick:document.getElementById("ns_nick").value,trainer_id:document.getElementById("ns_tr").value||null}); toast("수강생 추가됨"); });
}
function addStaff(){
  const name=document.getElementById("st_name").value.trim(); if(!name) return toast("이름을 입력하세요",true);
  act(async ()=>{ await api("/api/admin/staff","POST",{name,role:document.getElementById("st_role").value,discord_id:document.getElementById("st_did").value,base_salary:document.getElementById("st_base").value}); toast("운영진 추가됨"); });
}
function addPayment(){
  const student_id=parseInt(document.getElementById("pm_stu").value);
  const amount=parseInt(document.getElementById("pm_amt").value);
  const games=parseInt(document.getElementById("pm_games").value)||0;
  const payout_rate=Number(document.getElementById("pm_rate").value);
  if(!student_id||!amount) return toast("수강생·금액 확인",true);
  if(!(payout_rate>=0&&payout_rate<=1)) return toast("지급율 0~1 (예:0.7)",true);
  act(async ()=>{ await api("/api/admin/payments","POST",{student_id,paid_at:document.getElementById("pm_date").value,amount,games,payout_rate,via_youtube:!!document.getElementById("pm_yt").value,memo:document.getElementById("pm_memo").value}); toast("결제 추가됨"); });
}
function confirmRate(id,name,suggest){
  const cur = prompt(`${name} · 지급율 확정 (0~1)\n제안값(가중평균): ${suggest}\n\n숫자 입력 (예 0.7), 비우면 확정 해제:`, suggest);
  if(cur===null) return;
  const v = cur.trim()===""? null : Number(cur);
  if(v!==null && !(v>=0&&v<=1)) return toast("0~1 범위로 입력",true);
  act(async ()=>{ await api("/api/admin/students/"+id,"PATCH",{payout_rate_set:v}); toast(v===null?"확정 해제됨":name+" 지급율 "+Math.round(v*100)+"% 확정"); });
}
function sessFor(id,name){
  const g=prompt(`${name} · 진행판수 추가`,"3"); if(g===null) return;
  const games=parseInt(g); if(!(games>0)) return toast("1 이상 입력",true);
  act(async ()=>{ await api("/api/admin/sessions","POST",{student_id:id,games,played_at:today()}); toast(name+" "+games+"판 기록"); });
}
function payoutFor(staff_id,name,gross){
  const g=prompt(`${name} · 지급 세전액`, gross); if(g===null) return;
  const val=parseInt(g); if(!(val>=0)) return toast("금액 확인",true);
  act(async ()=>{ await api("/api/admin/payouts","POST",{staff_id,gross:val,paid_on:today()}); toast(name+" 지급 "+won(val)+"원 기록"); });
}
async function exportCsv(){
  try{
    const r = await fetch(API+"/api/admin/export.csv",{headers:authH()});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const blob = await r.blob(); const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="mri-settlement.csv"; a.click(); URL.revokeObjectURL(url);
    toast("CSV 내보냄");
  }catch(e){ toast("내보내기 실패: "+e.message, true); }
}
</script>
</body></html>
