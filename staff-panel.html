<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>운영진 패널 · MRI ACADEMY</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--bg-el:#15151a;--bg-card:#1a1a20;--ink:#f4f4f5;--ink-dim:#a1a1aa;--ink-faint:#71717a;
  --gold:#f5c518;--gold-soft:rgba(245,197,24,.3);--golddeep:#caa00f;--green:#10b981;--blue:#5ac8fa;--red:#e63946;--line:#27272a;
  --disp:'Archivo Black',sans-serif;--body:'Pretendard Variable',sans-serif;--mono:ui-monospace,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;
  background-image:radial-gradient(circle at 50% 0,rgba(245,197,24,.05),transparent 55%),
   linear-gradient(rgba(245,197,24,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(245,197,24,.02) 1px,transparent 1px);
  background-size:auto,38px 38px,38px 38px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 80px}
a{color:var(--gold);text-decoration:none}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.logo{font-family:var(--disp);font-size:17px;display:flex;align-items:center;gap:9px}
.logo .mk{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--gold),var(--golddeep));color:#000;display:flex;align-items:center;justify-content:center;font-size:13px}
.logo small{display:block;font-family:var(--body);font-size:8.5px;font-weight:800;letter-spacing:.2em;color:var(--ink-faint)}
.scope{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid var(--gold-soft);color:var(--gold);background:rgba(245,197,24,.07);letter-spacing:.05em}
.scope.tr{color:var(--blue);border-color:rgba(90,200,250,.3);background:rgba(90,200,250,.07)}
.spacer{margin-left:auto}
.btn{font-family:var(--body);font-weight:700;font-size:13px;padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:var(--bg-card);color:var(--ink);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--gold-soft)}
.btn.gold{background:var(--gold);color:#1a1500;border-color:var(--gold)}
.btn.gold:hover{background:#fde047;transform:translateY(-1px)}
.btn.sm{font-size:11.5px;padding:5px 9px}
.btn.disc{background:#5865F2;color:#fff;border-color:#5865F2}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:rgba(230,57,70,.3)}
h1{font-family:var(--disp);font-size:clamp(20px,4vw,26px);margin:20px 0 4px}
.sub{color:var(--ink-dim);font-size:13px;margin-bottom:18px}
section{margin-top:28px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h h2{font-family:var(--disp);font-size:15px}
.sec-h .tag{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.12em}
.sec-h .line{flex:1;height:1px;background:var(--line)}
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--bg-el);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.kpi .l{font-size:10.5px;color:var(--ink-faint);letter-spacing:.04em}
.kpi .v{font-family:var(--disp);font-size:20px;color:var(--gold);margin-top:5px}
.kpi .v.sm{font-size:15px;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 8px;border-bottom:1px solid rgba(39,39,42,.55);text-align:right;white-space:nowrap}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.tbl .name{font-weight:700;color:var(--ink)}
.tbl .pay{font-weight:800;color:var(--gold)}
.badge{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid}
.badge.ok{color:var(--green);border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.08)}
.badge.sug{color:var(--ink-faint);border-color:var(--line)}
.badge.remain{color:var(--blue);border-color:rgba(90,200,250,.3);background:rgba(90,200,250,.07)}
.scroll{overflow-x:auto}
.stu{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px}
.stu .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stu .nm{font-family:var(--disp);font-size:15px}
.stu .meta{font-size:12px;color:var(--ink-dim);margin-top:4px}
.stu .prog{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.pill{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:7px;background:var(--bg-el);border:1px solid var(--line);color:var(--ink-dim)}
.pill b{color:var(--gold)}
.frm{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
input,select{font-family:var(--body);font-size:13px;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
input:focus,select:focus{outline:none;border-color:var(--gold-soft)}
input.w-s{width:74px}input.w-m{width:110px}input.w-l{width:150px}
label.fl{font-size:11px;color:var(--ink-faint);display:flex;flex-direction:column;gap:3px}
.gate{text-align:center;padding:60px 20px}
.gate .em{font-size:40px;margin-bottom:14px}
.gate h2{font-family:var(--disp);font-size:20px;margin-bottom:8px}
.gate p{color:var(--ink-dim);font-size:14px;margin-bottom:20px}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:8px}
.formrow{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--bg-el);border:1px solid var(--gold-soft);
  color:var(--ink);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(230,57,70,.5);color:#fca5a5}
.muted{color:var(--ink-faint);font-size:12px}
.empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:24px}
.ops{margin-top:28px}
.ops-h{font-size:13px;color:var(--gold);font-weight:800;margin-bottom:12px;letter-spacing:.03em}
.ops-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px}
.oplink{display:flex;align-items:center;gap:9px;padding:13px 14px;background:var(--bg-card);border:1px solid var(--line);border-radius:9px;color:var(--ink);text-decoration:none;font-weight:700;font-size:13.5px;transition:.15s}
.oplink:hover{border-color:var(--gold-soft);background:rgba(245,197,24,.06)}
.oplink .ext{margin-left:auto;color:var(--ink-faint);font-size:12px}
.sched{margin-top:28px}
.sched-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sched-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.srow{background:var(--bg-card);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.srow.off{opacity:.5}
.srow .s1{font-size:13.5px;line-height:1.5}
.srow .s2{font-size:12px;margin-top:4px}
.srow .s3{display:flex;gap:6px;margin-top:9px}
.sched-form{background:var(--bg-el);border:1px dashed var(--line);border-radius:10px;padding:13px}
.sched-form .fh{font-size:12.5px;font-weight:800;color:var(--gold);margin-bottom:9px}
.sched-form .formrow{margin-bottom:9px}
.sched-form .formrow:last-child{margin-bottom:0}
.ck{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-dim);white-space:nowrap}
.ck input{width:auto;accent-color:var(--gold)}
</style>
</head><body>
<div class="wrap">
  <div style="background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.3);color:#f5c518;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:13px;font-weight:700;text-align:center;line-height:1.5">🔒 읽기전용 모드 (Phase 0.5) — 판수·결제 입력은 디스코드 <b>/수업등록</b>(구글시트)로만. 이 패널 입력은 시트에 반영되지 않습니다.</div>
  <div class="topbar">
    <div class="logo"><span class="mk">M</span><span>MRI ACADEMY<small>STAFF PANEL</small></span></div>
    <span id="scopeBadge" class="scope" style="display:none"></span>
    <div class="spacer"></div>
    <button id="logoutBtn" class="btn ghost sm" style="display:none" onclick="logout()">로그아웃</button>
  </div>

  <div id="gate" class="gate">
    <div class="em">🔒</div>
    <h2>운영진 전용</h2>
    <p>디스코드로 로그인하면 담당 수강생 판수 기록·정산 현황을 볼 수 있어요.</p>
    <button class="btn disc" onclick="login()">디스코드로 로그인</button>
    <div class="hint" id="gateHint"></div>
  </div>

  <div id="app" style="display:none"></div>
</div>
<div id="toast" class="toast"></div>

<script>
const API = "https://mri-academy-production.up.railway.app";
let ME = null, DATA = null, STAFF = [];

// ── 토큰 ──
(function(){ if(location.hash.startsWith("#token=")){ localStorage.setItem("mri_token", location.hash.slice(7)); history.replaceState(null,"",location.pathname); } })();
const token = () => localStorage.getItem("mri_token");
const authH = () => token() ? { Authorization: "Bearer " + token() } : {};
function login(){ location.href = API + "/api/auth/login?return=" + encodeURIComponent(location.href.split("#")[0]); }
function logout(){ localStorage.removeItem("mri_token"); ME=null; location.reload(); }

// ── API 헬퍼 ──
async function api(path, method="GET", body){
  const r = await fetch(API+path, { method, headers:{ "Content-Type":"application/json", ...authH() }, body: body?JSON.stringify(body):undefined });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ("HTTP "+r.status));
  return j;
}
const won = (n)=> Number(n||0).toLocaleString("ko-KR");
const esc = (s)=> String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = ()=> new Date().toISOString().slice(0,10);
function toast(msg, err){ const t=document.getElementById("toast"); t.textContent=msg; t.className="toast on"+(err?" err":""); clearTimeout(t._t); t._t=setTimeout(()=>t.className="toast",2600); }
const READONLY = true;  // Phase 0.5 — 시트가 진실인 동안 패널 쓰기 잠금(이중기입 방지). Phase 1 DB 전환 시 false + 서버 PANEL_WRITE=1.
async function act(fn){ if(READONLY){ toast("읽기전용 모드 — 판수·결제는 디스코드 /수업등록(시트)로 입력하세요. 이 패널 입력은 반영되지 않습니다.", true); return; } try{ await fn(); await reload(); }catch(e){ toast(e.message||"오류", true); } }

// ── 부팅 ──
(async function boot(){
  if(!token()){ return; }
  try{
    ME = await api("/api/auth/me");
    if(!ME.isStaff){ document.getElementById("gateHint").textContent = "이 계정("+esc(ME.name)+")은 운영진이 아니에요. 클랜장에게 문의하세요."; return; }
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("logoutBtn").style.display="inline-block";
    await reload();
  }catch(e){ localStorage.removeItem("mri_token"); document.getElementById("gateHint").textContent="세션이 만료됐어요. 다시 로그인해주세요."; }
})();

async function reload(){
  DATA = await api("/api/admin/overview");
  const sb = document.getElementById("scopeBadge");
  sb.style.display="inline-block";
  if(DATA.scope==="owner"){ sb.className="scope"; sb.textContent="OWNER · 전체"; STAFF = await api("/api/admin/staff").catch(()=>[]); renderOwner(); }
  else { sb.className="scope tr"; sb.textContent="TRAINER · "+(DATA.me?DATA.me.name:""); renderTrainer(); }
  // 🗓️ 일정 관리 + 🔗 운영 바로가기 — 로그인 후에만 렌더(reload는 인증 성공 후 호출).
  document.getElementById("app").insertAdjacentHTML("beforeend", '<div id="schedwrap"></div>' + (DATA.scope==="owner"?'<div id="statswrap"></div>':'') + opsLinks(DATA.scope==="owner"));
  loadSchedule();
  if(DATA.scope==="owner") loadStats();
}

// ── 📊 전적 스냅샷 (Phase T1, owner 전용) — server 라우트는 읽기전용 게이트 밖이라 직접 호출 ──
let SST=null, _sti=null;
function renderStats(){
  const w=document.getElementById("statswrap"); if(!w) return;
  const r=SST; let body;
  if(r && r.running){ body=`<div class="muted">실행 중… ${r.done}/${r.total} (계정당 ~7초)</div>`; }
  else if(r && r.finishedAt){
    const rated=(r.report||[]).filter(x=>!x.error).length;
    const cand=(r.candidates||[]).length ? (r.candidates||[]).map(c=>`<div class="srow"><b>${esc(c.student)}</b> · ${esc(c.trainer||"미배정")} · <span style="color:var(--gold)${c.provisional?";font-weight:600;opacity:.85":""}">${esc(c.cand_label||c.tier)}</span></div>`).join("") : `<div class="muted">없음</div>`;
    const ur=r.unlinkedReasons||{}; const urBits=[]; if(ur.no_platform)urBits.push(`플랫폼 미시드 ${ur.no_platform}`); if(ur.no_name_no_id)urBits.push(`닉 없음 ${ur.no_name_no_id}`);
    const urTxt=urBits.length?` (${urBits.join(" · ")})`:"";
    const nick=(r.nickChanges||[]).length ? (r.nickChanges||[]).map(n=>`<div class="srow"><b>${esc(n.student)}</b> · <span class="muted">${esc(n.from)} → </span><span style="color:var(--gold)">${esc(n.to)}</span></div>`).join("") : "";
    const inv=(r.needsInvestigation||[]).length ? (r.needsInvestigation||[]).map(i=>`<div class="srow"><b>${esc(i.student)}</b> · <span class="muted">${esc(i.reason)}</span></div>`).join("") : "";
    body=`<div class="pill">마스터+ 달성률 <b>${r.masterRate}%</b> (${r.masterCount}/${rated})</div>${r.unlinked?` <span class="muted">· 미연결 ${r.unlinked}명${esc(urTxt)}</span>`:""}
      <div style="margin-top:11px;font-size:12.5px;font-weight:700">승급 후보 (미등록 마스터+)</div>${cand}`
      +(nick?`<div style="margin-top:11px;font-size:12.5px;font-weight:700">🔄 닉변 감지 (이력 기록됨)</div>${nick}`:"")
      +(inv?`<div style="margin-top:11px;font-size:12.5px;font-weight:700">🔍 수동 조사 필요 (dak.gg)</div>${inv}`:"");
  } else { body=`<div class="muted">아직 실행하지 않았어요.</div>`; }
  w.innerHTML=`<section class="ops"><h2 class="ops-h">📊 전적 스냅샷 (PUBG)</h2>
    <button class="btn gold sm" onclick="runStats()"${r&&r.running?" disabled":""}>전수 스냅샷 실행</button>
    <span class="muted" style="margin-left:8px">계정당 ~7초 · 완료 시 오너 DM</span>
    <div style="margin-top:12px">${body}</div></section>`;
}
async function loadStats(){ try{ SST=await api("/api/admin/stats/report"); }catch(e){ SST=null; } renderStats(); if(SST&&SST.running) pollStats(); }
async function runStats(){
  try{ await api("/api/admin/stats/snapshot","POST"); toast("스냅샷 시작 — 완료까지 몇 분 걸려요"); }
  catch(e){ toast(e.message==="already_running"?"이미 실행 중":(e.message||"오류"), true); }
  pollStats();
}
function pollStats(){ clearInterval(_sti); _sti=setInterval(async()=>{ try{ SST=await api("/api/admin/stats/report"); renderStats(); if(!SST.running){ clearInterval(_sti); if(SST.finishedAt) toast("전적 스냅샷 완료 · 마스터+ "+SST.masterRate+"%"); } }catch(e){} }, 5000); }

// 운영 바로가기 카드 (staff 공통 + owner 전용 시트 링크). 전부 새 탭.
function opsLinks(isOwner){
  const L = (href,label,icon)=>`<a class="oplink" href="${href}" target="_blank" rel="noopener">${icon} ${label} <span class="ext">↗</span></a>`;
  const items = [
    L("https://shlee9498-dev.github.io/gmi-clancup/gdcup-score.html","G드컵 점수 입력","🎯"),
    ...(isOwner ? [
      L("https://docs.google.com/spreadsheets/d/1KTWL7zSQyZKwsVg39DVEUJA-_dr2L2fS-Wla8HuF1yg/edit","레슨 일정표 (구글시트)","📅"),
      L("https://docs.google.com/spreadsheets/d/1ROBPAp3y8KtByn8viZl_Q-x5uVjdVhkzyJLmqJFMB9U/edit","매출관리 시트","💰"),
    ] : []),
    L("https://shlee9498-dev.github.io/gmi-clancup/","G드컵 사이트","🏆"),
    L("https://book.mriacademy.gg","전자책 웹북","📖"),
  ];
  return `<section class="ops"><h2 class="ops-h">🔗 운영 바로가기</h2><div class="ops-grid">${items.join("")}</div></section>`;
}

// ── 🗓️ 일정 관리 (Phase S1) — schedule는 서버에서 읽기전용 게이트 예외라 act() 안 거치고 직접 쓴다 ──
const SCHED = { week:0, kind:"lesson", editing:null, _byId:{} };
const SCHED_FMT = { lesson:["관전형","참여형","1:1","그룹","자율연습","상담"], direct:["초급반","중급반","심화반","개인강의","그룹강의"] };
const DOW = ["일","월","화","수","목","금","토"];
const dPlus = (d,n)=>{ const x=new Date(d+"T00:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const schedDow = (d)=> DOW[new Date(d+"T00:00:00Z").getUTCDay()];

async function loadSchedule(){
  const wrap = document.getElementById("schedwrap"); if(!wrap) return;
  const isOwner = DATA.scope==="owner";
  let data;
  try{ data = await api(`/api/admin/schedule?week=${SCHED.week}&kind=${SCHED.kind}`); }
  catch(e){ wrap.innerHTML = `<section class="sched"><h2 class="ops-h">🗓️ 일정 관리</h2><div class="empty">일정을 불러오지 못했어요 (${esc(e.message)}). schedule_events 테이블 생성 여부를 확인하세요.</div></section>`; return; }
  const ev = data.events||[]; SCHED._byId={}; ev.forEach(e=>SCHED._byId[e.id]=e);
  const wt=(n,l)=>`<button class="btn sm ${SCHED.week===n?"gold":""}" onclick="setSchedWeek(${n})">${l}</button>`;
  const kt=(k,l)=>`<button class="btn sm ${SCHED.kind===k?"gold":""}" onclick="setSchedKind('${k}')">${l}</button>`;
  const list = ev.length ? ev.map(schedRow).join("") : `<div class="empty">이 주 ${SCHED.kind==="lesson"?"레슨":"직강"} 일정이 없어요.</div>`;
  const wk = data.week ? `${esc(data.week.start)} ~ ${esc(dPlus(data.week.end,-1))}` : "";
  wrap.innerHTML = `
  <section class="sched">
    <h2 class="ops-h">🗓️ 일정 관리 <span class="muted" style="font-weight:500;font-size:11px">${wk}</span></h2>
    <div class="sched-tabs">
      ${wt(0,"이번주")}${wt(1,"다음주")}${wt(2,"다다음주")}<span style="width:6px"></span>${kt("lesson","레슨")}${kt("direct","직강")}

function onSchedKindChange(){
  const k = document.getElementById("ss_kind").value;
  document.getElementById("ss_format").innerHTML = SCHED_FMT[k].map(f=>`<option>${f}</option>`).join("");
}
function setSchedWeek(n){ SCHED.week=n; SCHED.editing=null; loadSchedule(); }
function setSchedKind(k){ SCHED.kind=k; SCHED.editing=null; loadSchedule(); }
function schedEdit(id){ SCHED.editing=SCHED._byId[id]; loadSchedule().then(()=>{ const f=document.querySelector(".sched-form"); if(f) f.scrollIntoView({behavior:"smooth",block:"center"}); }); }
function schedCancelEdit(){ SCHED.editing=null; loadSchedule(); }

async function schedSave(){
  const ed = SCHED.editing;
  const g = (id)=>document.getElementById(id);
  const body = {
    kind: g("ss_kind").value, format: g("ss_format").value, event_date: g("ss_date").value,
    start_time: g("ss_start").value||null, end_time: g("ss_end").value||null,
    title: g("ss_title").value, participants: g("ss_part").value,
    capacity: g("ss_cap").value, memo: g("ss_memo").value,
    is_public: g("ss_public").checked, is_recruiting: g("ss_recruit").checked,
  };
  const tsel = g("ss_trainer"); if(tsel) body.trainer_id = tsel.value||null;
  if(!body.event_date) return toast("날짜를 선택하세요", true);
  try{
    if(ed){ await api("/api/admin/schedule/"+ed.id, "PATCH", body); toast("일정 수정됨"); SCHED.editing=null; }
    else { const r = await api("/api/admin/schedule","POST",body); toast("일정 추가됨"); if(r.warning) setTimeout(()=>toast(r.warning,true), 300); }
    await loadSchedule();
  }catch(e){ toast(e.message||"오류", true); }
}
async function schedCancel(id){
  if(!confirm("이 일정을 취소할까요? (기록은 남고 공개에서 숨겨집니다)")) return;
  try{ await api("/api/admin/schedule/"+id, "PATCH", {status:"cancelled"}); toast("일정 취소됨"); await loadSchedule(); }
  catch(e){ toast(e.message||"오류", true); }
}
async function copyWeek(force){
  const r = await fetch(API+"/api/admin/schedule/copy-week", { method:"POST", headers:{"Content-Type":"application/json", ...authH()}, body:JSON.stringify({week:SCHED.week, confirm:!!force}) });
  const j = await r.json().catch(()=>({}));
  if(r.status===409 && j.error==="target_not_empty"){ if(confirm(`다음 주에 이미 ${j.count}건 있어요. 그래도 추가로 복사할까요?`)) return copyWeek(true); return; }
  if(!r.ok){ return toast(j.error||"복사 오류", true); }
  toast(`${j.inserted}건 복사됨 → 다음 주`); SCHED.week=Math.min(2,SCHED.week+1); SCHED.editing=null; await loadSchedule();
}

function addSession(id){

  const played_at = document.getElementById("sd_"+id).value || today();
  const memo = document.getElementById("sm_"+id).value;
  act(async ()=>{ await api("/api/admin/sessions","POST",{student_id:id,games,played_at,memo}); toast("판수 "+games+"판 기록됨"); });
}

function addPayment(){
  const student_id=parseInt(document.getElementById("pm_stu").value);
  const amount=parseInt(document.getElementById("pm_amt").value);
  const games=parseInt(document.getElementById("pm_games").value)||0;
  const payout_rate=Number(document.getElementById("pm_rate").value);
  if(!student_id||!amount) return toast("수강생·금액 확인",true);
  if(!(payout_rate>=0&&payout_rate<=1)) return toast("지급율 0~1 (예:0.7)",true);
  act(async ()=>{ await api("/api/admin/payments","POST",{student_id,paid_at:document.getElementById("pm_date").value,amount,games,payout_rate,via_youtube:!!document.getElementById("pm_yt").value,memo:document.getElementById("pm_memo").value}); toast("결제 추가됨"); });

function confirmRate(id,name,suggest){
  const cur = prompt(`${name} · 지급율 확정 (0~1)\n제안값(가중평균): ${suggest}\n\n숫자 입력 (예 0.7), 비우면 확정 해제:`, suggest);
  if(cur===null) return;
  const v = cur.trim()===""? null : Number(cur);
  if(v!==null && !(v>=0&&v<=1)) return toast("0~1 범위로 입력",true);
  act(async ()=>{ await api("/api/admin/students/"+id,"PATCH",{payout_rate_set:v}); toast(v===null?"확정 해제됨":name+" 지급율 "+Math.round(v*100)+"% 확정"); });
}
function sessFor(id,name){
  const g=prompt(`${name} · 진행판수 추가`,"3"); if(g===null) return;
  const games=parseInt(g); if(!(games>0)) return toast("1 이상 입력",true);
  act(async ()=>{ await api("/api/admin/sessions","POST",{student_id:id,games,played_at:today()}); toast(name+" "+games+"판 기록"); });
}
function payoutFor(staff_id,name,gross){
  const g=prompt(`${name} · 지급 세전액`, gross); if(g===null) return;
  const val=parseInt(g); if(!(val>=0)) return toast("금액 확인",true);
  act(async ()=>{ await api("/api/admin/payouts","POST",{staff_id,gross:val,paid_on:today()}); toast(name+" 지급 "+won(val)+"원 기록"); });
}
async function exportCsv(){
  try{
    const r = await fetch(API+"/api/admin/export.csv",{headers:authH()});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const blob = await r.blob(); const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="mri-settlement.csv"; a.click(); URL.revokeObjectURL(url);
    toast("CSV 내보냄");
  }catch(e){ toast("내보내기 실패: "+e.message, true); }
}
