<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레벨 테스트 신청 · MRI ACADEMY</title>
<meta name="description" content="MRI ACADEMY 레벨 테스트 신청. 로그인하고 열린 시간을 고른 뒤 입금하면 디스코드로 확정 안내를 받아요.">
<link rel="canonical" href="https://mriacademy.gg/go">
<meta property="og:title" content="레벨 테스트 신청 · MRI ACADEMY">
<meta property="og:description" content="로그인 → 시간 고르기 → 입금 → 디스코드로 확정 안내">
<meta property="og:url" content="https://mriacademy.gg/go">
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 디자인 시스템 v1(CLAUDE.md) — 다크 바탕 · 골드는 채운 버튼 하나에만 */
:root{
  --bg:#0a0a0c; --surface-1:#15151a; --surface-2:#1a1a20; --line:#27272a;
  --ink:#f4f4f5; --ink-dim:#c6c6cd; --ink-faint:#9b9ba4;
  --gold:#f5c518; --on-gold:#17140c; --warn:#f0a5a5;
  --body:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --num:'Saira Condensed','Pretendard Variable',sans-serif;   /* 영문 · 숫자 */
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:40px 80px}
.logo{font-family:var(--num);font-weight:800;font-size:17px;letter-spacing:.08em;text-decoration:none;color:var(--ink-dim)}
h1{margin-top:22px;font-size:clamp(26px,6vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.lead{margin-top:10px;color:var(--ink-dim)}
.badge{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-1);font-size:14px;color:var(--ink-dim)}
.badge b{color:var(--ink)}
.card{margin-top:20px;background:var(--surface-1);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h2{font-size:18px;font-weight:800}
.card p{margin-top:6px;color:var(--ink-dim);font-size:15px}
.muted{color:var(--ink-faint);font-size:14px}
.msg{margin-top:14px;font-size:14px;color:var(--warn)}
.msg:empty{display:none}
/* 칩 · 버튼 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:700 15px/1 var(--body);text-decoration:none;cursor:pointer}
.chip:hover{border-color:var(--ink-faint)}
.chip.main{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.chip[disabled]{opacity:.5;cursor:default}
.chip.full{width:100%}
.login .chip{width:100%}
/* 입력 */
label.f{display:block;margin-top:14px;font-size:14px;font-weight:700}
input.t{display:block;width:100%;margin-top:8px;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:500 16px var(--body)}
input.t:focus{outline:2px solid var(--ink-faint);outline-offset:1px}
/* 칸 목록 */
.day{margin-top:20px}
.day h3{font-size:15px;font-weight:800;color:var(--ink-dim)}
.slots{display:grid;gap:8px;margin-top:8px}
.slot{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.slot:focus-visible{outline:2px solid var(--ink)}
.slot[aria-pressed="true"]{border-color:var(--gold)}
.slot .tm{font-family:var(--num);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.slot .who{font-size:14px;color:var(--ink-dim);text-align:right}
/* 예약 요약 · 계좌 */
dl.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin-top:12px;font-size:15px}
dl.sum dt{color:var(--ink-faint)}
dl.sum dd{margin:0;min-width:0}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.acct code{font:800 19px var(--num);letter-spacing:.02em;font-variant-numeric:tabular-nums}
/* 디스코드 2단계 */
.step{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:0}
.step .n{font-size:13px;font-weight:700;color:var(--ink-faint)}
.step b{display:block;margin-top:2px;font-size:17px}
.step .how{margin-top:6px;font-size:15px}
.step .why{margin-top:4px;font-size:14px;color:var(--ink-faint)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-weight:700}
.foot{margin-top:28px;font-size:14px;color:var(--ink-faint)}
.foot a{color:var(--ink-dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="12a35ed9-1619-4484-8ad7-7fb7b1dfe52d"></script>
</head>
<body>
<main class="wrap">
  <a class="logo" href="index.html">MRI ACADEMY</a>
  <div id="badge" class="badge" hidden></div>
  <div id="view" aria-live="polite"><p class="lead">불러오는 중</p></div>
  <p class="foot">레벨 테스트는 시작 3시간 전까지 취소하면 전액 환불이에요. 그 뒤 취소와 불참은 환불되지 않아요<br>
    <a href="terms.html">이용약관</a> · <a href="privacy.html">개인정보처리방침</a></p>
</main>

<script>
// /go 레벨 테스트 신청 — 계약 docs/trainer-portal-api.md §9.48(로그인 · 연락처) · §9.49(칸 · 입금했어요 · 취소) · §9.48.6(src · code · 할인 배지)
//   키는 화면에 두지 않는다. 로그인 토큰은 주소 # 에서 읽어 이 탭(sessionStorage)에만 둔다.
//   판수 · 금액 · 계좌 · 기한은 서버 값만 쓴다. 글자는 textContent 로만 넣는다.
(function(){
  var API = "https://mri-academy-production.up.railway.app";
  var DISCORD = "https://mriacademy.gg/discord";
  var UTM = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"];
  var view = document.getElementById("view");
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];

  // ── 저장(실패해도 화면은 돈다) ──
  var mem = {};
  function sget(k){ try { var v = sessionStorage.getItem(k); return v == null ? mem[k] || null : v; } catch (e) { return mem[k] || null; } }
  function sset(k, v){ mem[k] = v; try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }

  // ── 주소 읽기: v · utm · src · code 는 로그인 갔다 와도 남게 적어 둔다(§9.48.1 ①) ──
  var q = new URLSearchParams(location.search);
  var ctx = {}; try { ctx = JSON.parse(sget("go.ctx") || "{}") || {}; } catch (e) { ctx = {}; }
  function keep(k, re){ var v = q.get(k); if (v && re.test(v)) ctx[k] = v; }
  keep("v", /^[A-Za-z0-9_-]{1,32}$/); keep("src", /^[a-z0-9-]{1,32}$/); keep("code", /^[A-Za-z0-9]{3,20}$/);
  if (ctx.code) ctx.code = String(ctx.code).toUpperCase();
  UTM.forEach(function(k){ var v = q.get(k); if (v) ctx[k] = v.slice(0, 100); });
  sset("go.ctx", JSON.stringify(ctx));
  var startError = q.get("error");

  // ── 로그인에서 돌아오면 # 에 토큰이 붙어 온다(§9.48.1 ③) — 읽고 바로 지운다 ──
  var hash = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (hash.get("access_token")) sset("go.tok", hash.get("access_token"));
  var hashError = hash.get("error");
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  function token(){ return sget("go.tok"); }

  // ── 작은 도구 ──
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function chip(text, opt){ opt = opt || {}; var e = el(opt.href ? "a" : "button", "chip" + (opt.main ? " main" : "") + (opt.full ? " full" : ""), text);
    if (opt.href) { e.href = opt.href; if (opt.ext) { e.target = "_blank"; e.rel = "noopener"; } } else e.type = "button";
    if (opt.on) e.addEventListener("click", opt.on); return e; }
  function kst(iso){ var t = Date.parse(iso); if (!isFinite(t)) return null; var d = new Date(t + 9 * 3600000);
    return { md: (d.getUTCMonth() + 1) + "월 " + d.getUTCDate() + "일", dow: DOW[d.getUTCDay()], hm: d.toISOString().slice(11, 16) }; }
  function when(iso){ var k = kst(iso); return k ? k.md + "(" + k.dow + ") " + k.hm : ""; }
  function won(n){ return Number(n).toLocaleString("ko-KR") + "원"; }
  function clear(){ view.textContent = ""; window.scrollTo(0, 0); }
  function head(title, lead){ view.appendChild(el("h1", null, title)); if (lead) view.appendChild(el("p", "lead", lead)); }
  function msgBox(){ var m = el("p", "msg"); m.setAttribute("role", "alert"); return m; }
  function inquiry(){ return chip("문의하기", { href: DISCORD, ext: true }); }

  // 오류 코드 → 화면 한 줄(§9.48.3 · §9.49.4)
  var ERR = {
    contact_required: "디스코드 아이디나 전화번호를 적어 주세요",
    contact_length: "2~60자로 적어 주세요",
    login_required: "로그인이 풀렸어요 다시 한 번 눌러 주세요",
    too_many_requests: "잠깐 뒤에 다시 눌러 주세요",
    unavailable: "지금 신청이 안 돼요 디스코드로 말해 주세요",
    table_missing: "지금 신청이 안 돼요 디스코드로 말해 주세요",
    apply_first: "연락처를 먼저 적어 주세요",
    slot_taken: "다른 분이 먼저 고른 시간이에요 다른 시간을 골라 주세요",
    booking_closed: "곧 시작하는 시간이라 고를 수 없어요 다른 시간을 골라 주세요",
    already_booked: "이미 고른 시간이 있어요 바꾸려면 취소한 뒤 다시 골라 주세요",
    slot_not_found: "없어진 시간이에요 목록을 새로 불러올게요",
    depositor_required: "입금자 이름을 적어 주세요",
    pay_deadline_passed: "입금 기한이 지났어요",
    not_waiting: "이미 처리된 신청이에요 화면을 새로 불러올게요",
    cancel_window_passed: "시작 3시간 전이 지나 취소할 수 없어요 급한 사정은 디스코드로 말해 주세요",
    not_booked: "취소할 예약이 없어요",
    busy: "처리 중이에요 잠깐 뒤에 다시 눌러 주세요",
    state_changed: "상태가 바뀌었어요 화면을 새로 불러올게요"
  };
  function errText(code){ return ERR[code] || "잠깐 문제가 생겼어요 다시 눌러 주세요"; }

  function call(method, path, body){
    var h = { "Accept": "application/json" };
    if (body) h["Content-Type"] = "application/json";
    var t = token(); if (t) h["Authorization"] = "Bearer " + t;
    return fetch(API + path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: "no-store" })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return { ok: r.ok, status: r.status, data: d || {} }; }); })
      .catch(function(){ return { ok: false, status: 0, data: { error: "unavailable" } }; });
  }

  // ── 쇼츠 할인 배지(§9.48.6) — 켜져 있고 기간 안일 때만 ──
  if (ctx.code) {
    fetch(API + "/api/events/" + encodeURIComponent(ctx.code), { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      if (!d || d.active !== true || !(Number(d.discount) > 0)) return;
      var b = document.getElementById("badge"); b.textContent = "";
      var s = el("b", null, "정식 등록 시 " + Number(d.discount) + "% 할인");
      b.appendChild(s);
      if (d.until) b.appendChild(document.createTextNode(" · " + String(d.until).replace(/-/g, ".") + "까지"));
      b.appendChild(el("br")); b.appendChild(el("span", null, "레벨 테스트비에는 할인이 없어요"));
      b.hidden = false;
    }).catch(function(){});
  }

  // ── ① 로그인 ──
  function loginUrl(provider){
    var p = new URLSearchParams(); p.set("provider", provider);
    ["v", "src", "code"].concat(UTM).forEach(function(k){ if (ctx[k]) p.set(k, ctx[k]); });
    return API + "/api/go/login?" + p.toString();
  }
  function showLogin(note){
    clear(); sset("go.tok", null);
    head("레벨 테스트 신청", "로그인하고 열린 시간을 고르면 돼요. 레벨 테스트는 보통 60분, 최대 90분이에요");
    var c = el("div", "card login");
    c.appendChild(el("h2", null, "로그인하고 시작하기"));
    var chips = el("div", "chips");
    chips.appendChild(chip("구글로 계속하기", { href: loginUrl("google"), main: true }));
    chips.appendChild(chip("디스코드로 계속하기", { href: loginUrl("discord") }));
    chips.appendChild(chip("카카오로 계속하기", { href: loginUrl("kakao") }));
    c.appendChild(chips);
    var m = msgBox(); if (note) m.textContent = note; c.appendChild(m);
    view.appendChild(c);
  }

  // ── ② 연락처(§9.48.2) ──
  function showContact(me, again){
    clear();
    head(again ? "연락처 바꾸기" : "연락처를 알려 주세요", "확정 안내를 놓치지 않게 디스코드 아이디나 전화번호 하나만 적어 주세요");
    var c = el("div", "card"); var f = el("form");
    var lb = el("label", "f", "디스코드 아이디 또는 전화번호"); lb.setAttribute("for", "contact");
    var inp = el("input", "t"); inp.id = "contact"; inp.name = "contact"; inp.maxLength = 60; inp.autocomplete = "off"; inp.required = true;
    var m = msgBox(); var go = chip(again ? "바꾸기" : "다음", { main: true, full: true }); go.type = "submit";
    var chips = el("div", "chips"); chips.appendChild(go);
    f.appendChild(lb); f.appendChild(inp); f.appendChild(chips); f.appendChild(m); c.appendChild(f); view.appendChild(c);
    f.addEventListener("submit", function(e){
      e.preventDefault(); go.disabled = true; m.textContent = "";
      var utm = {}; UTM.forEach(function(k){ if (ctx[k]) utm[k] = ctx[k]; });
      call("POST", "/api/go/apply", { contact: inp.value, v: ctx.v || null, utm: utm, src: ctx.src || null, code: ctx.code || null }).then(function(r){
        go.disabled = false;
        if (r.status === 401) return showLogin(errText("login_required"));
        if (!r.ok) { m.textContent = errText(r.data.error); return; }
        route();
      });
    });
    inp.focus();
  }

  // ── ③ 칸 고르기(§9.49.4 GET /api/go/slots) ──
  function showSlots(note){
    clear();
    head("시간 고르기", "");
    var lead = view.querySelector(".lead") || el("p", "lead"); view.appendChild(lead);
    var m = msgBox(); if (note) m.textContent = note; view.appendChild(m);
    var box = el("div"); view.appendChild(box);
    box.appendChild(el("p", "muted", "불러오는 중"));
    call("GET", "/api/go/slots").then(function(r){
      box.textContent = "";
      if (!r.ok) { m.textContent = errText(r.data.error); box.appendChild(chips1(inquiry())); return; }
      var d = r.data, slots = d.slots || [];
      lead.textContent = (d.fee ? "레벨 테스트비 " + won(d.fee) : "레벨 테스트") + (d.lengthNote ? " · " + d.lengthNote : "");
      if (!slots.length) {
        var c = el("div", "card"); c.appendChild(el("h2", null, "지금 열린 시간이 없어요"));
        c.appendChild(el("p", null, "새 시간이 열리면 여기에 바로 보여요. 원하는 시간대가 있으면 문의해 주세요"));
        c.appendChild(chips1(inquiry())); box.appendChild(c); box.appendChild(changeContact()); return;
      }
      var byDay = {}, order = [];
      slots.forEach(function(s){ var k = s.date || ""; if (!byDay[k]) { byDay[k] = []; order.push(k); } byDay[k].push(s); });
      var picked = null, pickBtn = null;
      var pay = el("div", "card"); pay.hidden = true;
      order.forEach(function(date){
        var sec = el("section", "day"); var first = byDay[date][0], k = kst(first.startAt);
        sec.appendChild(el("h3", null, k ? k.md + " " + k.dow + "요일" : date));
        var list = el("div", "slots");
        byDay[date].forEach(function(s){
          var b = el("button", "slot"); b.type = "button"; b.setAttribute("aria-pressed", "false");
          b.appendChild(el("span", "tm", s.startTime || (kst(s.startAt) || {}).hm || ""));
          var who = s.trainer ? (s.trainer.name + (s.trainer.isOwner ? " · 원장" : " · 트레이너")) : "";
          b.appendChild(el("span", "who", who));
          b.addEventListener("click", function(){
            if (pickBtn) pickBtn.setAttribute("aria-pressed", "false");
            picked = s; pickBtn = b; b.setAttribute("aria-pressed", "true");
            renderPay(); pay.hidden = false; pay.scrollIntoView({ behavior: "smooth", block: "nearest" });
          });
          list.appendChild(b);
        });
        sec.appendChild(list); box.appendChild(sec);
      });
      box.appendChild(pay);
      box.appendChild(changeContact());
      function renderPay(){
        pay.textContent = "";
        pay.appendChild(el("h2", null, when(picked.startAt) + " · " + (picked.trainer ? picked.trainer.name : "")));
        pay.appendChild(el("p", null, "결제 방법을 고르면 이 시간이 잡혀요"));
        var pm = msgBox();
        var chips = el("div", "chips");
        chips.appendChild(chip("이 시간으로 할게요 · 계좌이체", { main: true, on: function(){ book("transfer", this, pm); } }));
        if (d.cardLink) chips.appendChild(chip("이 시간으로 할게요 · 카드", { on: function(){ book("card", this, pm); } }));
        pay.appendChild(chips); pay.appendChild(pm);
      }
      function book(method, btn, pm){
        btn.disabled = true; pm.textContent = "";
        call("POST", "/api/go/book", { slotKey: picked.slotKey, payMethod: method }).then(function(r){
          btn.disabled = false;
          if (r.status === 401) return showLogin(errText("login_required"));
          if (r.data.error === "apply_first") return route();
          if (r.data.error === "slot_not_found" || r.data.error === "slot_taken" || r.data.error === "booking_closed") return showSlots(errText(r.data.error));
          if (r.data.error === "already_booked") return route();
          if (!r.ok) { pm.textContent = errText(r.data.error); return; }
          showLevelTest(r.data);
        });
      }
    });
  }
  function changeContact(){ var p = el("p", "foot"); p.appendChild(chip("연락처 바꾸기", { on: function(){ showContact(null, true); } })); return p; }
  function chips1(a){ var c = el("div", "chips"); c.appendChild(a); return c; }

  // ── 예약 요약 ──
  function summary(lt){
    var dl = el("dl", "sum");
    function row(k, v){ if (!v) return; dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); }
    var b = lt.booking || {};
    row("시간", b.startAt ? when(b.startAt) : "");
    row("길이", b.durationNote || "");
    row("진행", b.trainer && b.trainer.name || "");
    if (lt.pay && lt.pay.amount) row("금액", won(lt.pay.amount));
    return dl;
  }
  function cancelChip(m){
    return chip("취소할게요", { on: function(){
      var btn = this; btn.disabled = true; m.textContent = "";
      call("POST", "/api/go/cancel").then(function(r){
        btn.disabled = false;
        if (r.status === 401) return showLogin(errText("login_required"));
        if (!r.ok) { m.textContent = errText(r.data.error); if (r.data.error === "state_changed" || r.data.error === "not_booked") route(); return; }
        route();
      });
    } });
  }

  // ── ④ 상태별 화면(§9.49.3) ──
  function showLevelTest(lt){
    var st = lt.state;
    if (st === "waiting") return showWaiting(lt);
    if (st === "claimed") return showDiscord(lt, false);
    if (st === "confirmed") return showDiscord(lt, true);
    if (st === "cancelled") return showSlots("예약을 취소했어요. 시작 3시간 전까지 취소하면 전액 환불이에요");
    if (st === "expired") return showSlots("시간이 지나 자리를 풀었어요 다시 골라 주세요");
    return showSlots();
  }
  function showWaiting(lt){
    clear();
    var p = lt.pay || {}, card = p.method === "card";
    head(card ? "카드로 결제해 주세요" : "입금해 주세요", lt.test ? "[시험] 시험 신청이에요" : "");
    var c = el("div", "card"); c.appendChild(el("h2", null, "고른 시간")); c.appendChild(summary(lt)); view.appendChild(c);
    var pc = el("div", "card"); var m = msgBox();
    if (p.deadline) pc.appendChild(el("p", null, when(p.deadline) + "까지 " + (card ? "결제" : "입금") + "하지 않으면 자리가 풀려요"));
    if (!card) {
      pc.insertBefore(el("h2", null, "입금 계좌"), pc.firstChild);
      if (p.bank) {
        var a = el("div", "acct"); var code = el("code", null, p.bank.name + " " + p.bank.account); a.appendChild(code);
        var cp = chip("복사"); cp.addEventListener("click", function(){
          var t = String(p.bank.account);
          if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ cp.textContent = "복사됐어요"; }, function(){ cp.textContent = "길게 눌러 복사해 주세요"; });
          else cp.textContent = "길게 눌러 복사해 주세요";
        });
        a.appendChild(cp); pc.appendChild(a);
        if (p.bank.holder) pc.appendChild(el("p", "muted", "받는 분 " + p.bank.holder));
      } else pc.appendChild(el("p", null, "계좌 안내를 불러오지 못했어요 디스코드로 문의해 주세요"));
      var lb = el("label", "f", "입금자 이름"); lb.setAttribute("for", "dep");
      var inp = el("input", "t"); inp.id = "dep"; inp.maxLength = 20; inp.autocomplete = "name";
      pc.appendChild(lb); pc.appendChild(inp);
    } else {
      pc.insertBefore(el("h2", null, "카드 결제"), pc.firstChild);
      if (p.cardLink && /^https:\/\//.test(p.cardLink)) pc.appendChild(chips1(chip("카드로 결제하기", { href: p.cardLink, ext: true })));
      else pc.appendChild(el("p", null, "카드 결제 링크를 불러오지 못했어요 디스코드로 문의해 주세요"));
    }
    var chips = el("div", "chips");
    chips.appendChild(chip(card ? "결제했어요" : "입금했어요", { main: true, on: function(){
      var btn = this; btn.disabled = true; m.textContent = "";
      var body = card ? {} : { depositorName: inp.value.trim() };
      if (!card && !body.depositorName) { btn.disabled = false; m.textContent = errText("depositor_required"); inp.focus(); return; }
      call("POST", "/api/go/paid", body).then(function(r){
        btn.disabled = false;
        if (r.status === 401) return showLogin(errText("login_required"));
        if (!r.ok) { m.textContent = errText(r.data.error); if (r.data.error === "not_waiting" || r.data.error === "pay_deadline_passed") setTimeout(route, 1200); return; }
        showLevelTest(r.data);
      });
    } }));
    chips.appendChild(cancelChip(m));
    pc.appendChild(chips); pc.appendChild(m); view.appendChild(pc);
  }
  // 입금했어요 다음 = 디스코드 2단계(오너 11/2 · 문구 그대로)
  function showDiscord(lt, confirmed){
    clear();
    head(confirmed ? "확정됐어요" : "입금 확인을 기다리고 있어요", lt.test ? "[시험] 시험 신청이에요" : "");
    var s = el("div", "card");
    var st1 = el("div", "step"); st1.appendChild(el("span", "n", "1단계")); st1.appendChild(el("b", null, "원장 디스코드 친구 추가"));
    var how = el("p", "how"); how.appendChild(document.createTextNode("디스코드 → 친구 추가 → ")); how.appendChild(el("span", "tag", "e_muri")); st1.appendChild(how);
    st1.appendChild(el("p", "why", "테스트 일정 확정과 진행 링크를 1:1로 보내 드리려고요"));
    var st2 = el("div", "step"); st2.appendChild(el("span", "n", "2단계")); st2.appendChild(el("b", null, "MRI ACADEMY 서버 입장"));
    st2.appendChild(chips1(chip("서버 들어가기", { href: DISCORD, ext: true, main: true })));
    st2.appendChild(el("p", "why", "레벨 테스트 음성 채널이 이 서버에 있어요"));
    s.appendChild(st1); s.appendChild(st2); view.appendChild(s);
    var c = el("div", "card"); c.appendChild(el("h2", null, "고른 시간")); c.appendChild(summary(lt));
    var m = msgBox();
    c.appendChild(el("p", null, confirmed ? "확정 안내는 디스코드로 보내 드려요" : "입금이 확인되면 디스코드로 확정 안내를 보내 드려요"));
    var chips = el("div", "chips"); chips.appendChild(inquiry()); chips.appendChild(cancelChip(m));
    c.appendChild(chips); c.appendChild(m); view.appendChild(c);
  }

  // ── 흐름 ──
  function route(){
    if (!token()) {
      var note = "";
      if (startError === "unavailable") note = errText("unavailable");
      else if (hashError) note = "로그인을 마치면 신청할 수 있어요";
      startError = null; hashError = null;
      return showLogin(note);
    }
    call("GET", "/api/go/me").then(function(r){
      if (r.status === 401) return showLogin(errText("login_required"));
      if (!r.ok) { clear(); head("레벨 테스트 신청"); var m = msgBox(); m.textContent = errText(r.data.error); view.appendChild(m); view.appendChild(chips1(inquiry())); return; }
      var me = r.data;
      if (!me.applied) return showContact(me, false);
      if (me.levelTest && me.levelTest.state) return showLevelTest(me.levelTest);
      showSlots();
    });
  }
  route();
})();
</script>
</body>
</html>
