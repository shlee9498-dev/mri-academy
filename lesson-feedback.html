<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>코칭 기록 · MRI ACADEMY</title>
<meta name="description" content="MRI ACADEMY 코칭 기록 원장 — 트레이너가 남긴 세션별 코칭 내용을 익명으로 공개합니다.">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#0a0a0c;--surface-1:#141419;--surface-2:#1b1b21;--line:#26262c;--ink:#f4f4f5;--ink-body:#c6c6cd;--ink-dim:#9b9ba4;--gold:#f5c518;--gold-deep:#caa00f;--display:'Saira Condensed','Pretendard Variable',sans-serif;--body:'Pretendard Variable',-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{padding:56px 0 30px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.brand .g{color:var(--gold)}
.kicker{display:flex;align-items:center;gap:8px;margin:26px 0 10px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.kicker::before{content:"";width:14px;height:3px;background:var(--gold)}
h1{font-size:clamp(28px,7vw,40px);font-weight:800;line-height:1.12}
.sub{color:var(--ink-body);font-size:16px;max-width:540px;margin-top:12px}
.statbar{display:flex;gap:26px;padding:18px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.statbar[hidden]{display:none}
.stat .n{font-family:var(--display);font-weight:800;font-size:24px;color:var(--gold)}
.stat .l{font-size:14px;font-weight:700;color:var(--ink-dim)}
.state{padding:30px 0;color:var(--ink-body);font-size:15px;border-bottom:1px solid var(--line)}
.state b{color:var(--ink)}
.feed{border-top:2px solid var(--gold);margin-top:26px}
.rec{padding:18px 2px;border-bottom:1px solid var(--line)}
.rec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.rec .date{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.06em;color:var(--gold);font-variant-numeric:tabular-nums}
.rec .who{font-size:15px;font-weight:800}
.rec .tr{font-size:14px;font-weight:700;color:var(--ink-dim)}
.rec .body{font-size:15px;color:var(--ink-body);white-space:pre-line}
.note{margin:30px 0 0;font-size:14px;color:var(--ink-body);line-height:1.7}
.back{display:inline-block;margin:26px 0 60px;font-weight:700;font-size:15px}
@media(prefers-reduced-motion:no-preference){
  .fade{animation:fade .35s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
</style><script defer src="https://cloud.umami.is/script.js" data-website-id="12a35ed9-1619-4484-8ad7-7fb7b1dfe52d"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="g">GmI</span> MRI ACADEMY</div>
    <div class="kicker">Coaching Records</div>
    <h1>코칭 기록</h1>
    <p class="sub">트레이너가 세션마다 남기는 코칭 원장. 레슨생은 익명, 내용은 원문 그대로 공개합니다.</p>
  </header>
  <div class="statbar" id="statbar" hidden>
    <div class="stat"><div class="n" id="stCount"></div><div class="l">공개 코칭 기록</div></div>
    <div class="stat"><div class="n" id="stStudents"></div><div class="l">레슨생</div></div>
    <div class="stat"><div class="n" id="stTrainers"></div><div class="l">트레이너</div></div>
  </div>
  <div id="feed">
    <div class="state" id="feedState"><b>기록 불러오는 중</b> — 최근 코칭 기록을 조회하고 있습니다. 잠시 후 이 자리에 표시됩니다.</div>
  </div>
  <p class="note">※ 레슨생 표기는 서버에서 익명 처리한 별칭입니다(레슨생 A·B·…). 본문 속 이름도 서버가 자동 치환합니다. 트레이너는 활동명으로 표기합니다. 최근 50건 기준.</p>
  <a class="back" href="index.html">← MRI ACADEMY 홈</a>
</div>
<script>
(function(){
  var API="https://mri-academy-production.up.railway.app";
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  fetch(API+"/api/feedback-public").then(function(r){return r.json();}).then(function(d){
    var items=(d&&d.items)||[];
    if(!items.length){
      document.getElementById("feedState").innerHTML="<b>기록 준비 중</b> — 공개 승인된 코칭 기록이 쌓이는 대로 이 자리에 표시됩니다.";
      return;
    }
    var html='<div class="feed">'+items.map(function(r,i){
      return '<div class="rec fade" style="animation-delay:'+Math.min(i*30,400)+'ms">'
        +'<div class="rec-head"><span class="date">'+esc(r.date)+'</span>'
        +'<span class="who">'+esc(r.alias)+'</span>'
        +(r.trainer?'<span class="tr">담당 '+esc(r.trainer)+'</span>':'')
        +'</div><div class="body">'+esc(r.summary)+'</div></div>';
    }).join("")+'</div>';
    document.getElementById("feed").innerHTML=html;
    var students={},trainers={};
    items.forEach(function(r){students[r.alias]=1;if(r.trainer)trainers[r.trainer]=1;});
    document.getElementById("stCount").textContent=items.length+"건";
    document.getElementById("stStudents").textContent=Object.keys(students).length+"명";
    document.getElementById("stTrainers").textContent=Object.keys(trainers).length+"명";
    document.getElementById("statbar").hidden=false;
  }).catch(function(){
    document.getElementById("feedState").innerHTML="<b>기록 불러오는 중</b> — 서버 응답이 지연되고 있습니다. 잠시 후 새로고침으로 다시 확인할 수 있습니다.";
  });
})();
</script>
</body></html>
