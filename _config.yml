# GitHub Pages(mriacademy.gg) 빌드 설정 — 사이트가 쓰지 않는 파일은 공개 주소에 올리지 않는다.
#
# 이 파일이 없던 동안 Pages 는 저장소 루트를 통째로 서빙했다. docs/*.md 가 /docs/*.html 로 바뀌어 열리고
# server.js · admin-panel.js · *.sql · scripts/*.json 원문도 그대로 받아졌다. 수강생 이름 · 결제 기록이
# 적힌 운영 문서가 로그인 없이 열리던 경로다(2026-09-30 개인정보 전수 점검 · 오너 OK).
#
# 사이트가 실제로 불러오는 건 *.html · 이미지(*.png · img/) · *.webmanifest · sitemap.xml · robots.txt 뿐이다
# (같은 날 HTML 의 src · href · fetch 참조 전수 확인 — 아래 목록 중 페이지가 부르는 파일은 없다).
# 새 파일을 사이트에서 부르게 되면 여기서 빠져 있는지 먼저 본다.
#
# exclude 를 적으면 Jekyll 기본 제외 목록이 이 목록으로 바뀐다 — 기본값(Gemfile · node_modules · vendor · CNAME)도
# 그래서 함께 적는다. 점(.)으로 시작하는 경로(.claude · .github 등)는 Jekyll 이 원래 올리지 않는다.
exclude:
  # 운영 문서 · 설계 문서 · 작업 규칙(수강생 이름 · 금액이 들어 있다)
  - docs
  - "*.md"
  # 서버 코드 · 설정 · 시험 · 픽스처(API 서버는 Railway 에서 따로 돈다)
  - server.js
  - admin-panel.js
  - "*.cjs"
  - config
  - scripts
  # 스키마 · 시드 SQL
  - "*.sql"
  # 패키지 · 도구 파일 · Cloudflare Pages 허용 목록(파일 이름만 있지만 사이트 파일이 아니다)
  - site-files.txt
  - package.json
  - package-lock.json
  - skills-lock.json
  # Jekyll · GitHub Pages 기본 제외 목록(위 설명 참조)
  - CNAME
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
